<script id="ag-v2646-motion-system-js">
(function(){
  /* ---------- Bottom nav geometry: animate the top line between real button centers. ---------- */
  function syncBottomNav46(){
    document.querySelectorAll('.bottom-nav').forEach(nav=>{
      const slider=nav.querySelector('.nav-active-slider');
      const buttons=[...nav.querySelectorAll(':scope > button')];
      if(!slider||!buttons.length)return;

      const raw=slider.getAttribute('style')||'';
      const mf=raw.match(/--nav-from:\s*(\d+)/);
      const mt=raw.match(/--nav-to:\s*(\d+)/);
      const from=Math.min(buttons.length-1,Math.max(0,Number(mf?.[1]??0)));
      const to=Math.min(buttons.length-1,Math.max(0,Number(mt?.[1]??from)));

      const centerX=(btn)=>btn.offsetLeft+(btn.offsetWidth/2)-12;
      slider.style.setProperty('--ag-nav-from-x',Math.round(centerX(buttons[from]))+'px');
      slider.style.setProperty('--ag-nav-to-x',Math.round(centerX(buttons[to]))+'px');

      if(from===to){
        slider.style.animation='none';
        slider.style.transform=`translateX(${Math.round(centerX(buttons[to]))}px)`;
      }else{
        slider.style.removeProperty('animation');
        slider.style.removeProperty('transform');
        void slider.offsetWidth;
      }
    });
  }

  /* ---------- Shared button motion audit. ---------- */
  function enhanceButtons46(root=document){
    const scope=root?.querySelectorAll ? root : document;
    scope.querySelectorAll('button').forEach(btn=>{
      if(btn.closest('.bottom-nav'))return;
      if(btn.matches('.ai-assistive-fab,.password-toggle,.ai-listen'))return;
      btn.classList.add('ag-v2646-pressable');
    });
  }

  /* Circular tap ripple removed in v26.56. */

  /* ---------- AI opening from the Assistive Touch anchor. ---------- */
  function root46(){
    return document.querySelector('.phone-screen') || document.querySelector('.mobile-root');
  }

  function captureFab46(){
    const root=root46();
    const fab=root?.querySelector('.ai-assistive-fab');
    if(!root)return null;
    const rr=root.getBoundingClientRect();
    if(!fab){
      return {root,rr,cx:rr.width-45,cy:rr.height-123,left:rr.width-72,right:rr.width-18,top:rr.height-150,bottom:rr.height-96};
    }
    const fr=fab.getBoundingClientRect();
    return {
      root,rr,
      cx:(fr.left+fr.right)/2-rr.left,
      cy:(fr.top+fr.bottom)/2-rr.top,
      left:fr.left-rr.left,
      right:fr.right-rr.left,
      top:fr.top-rr.top,
      bottom:fr.bottom-rr.top
    };
  }

  function placeAssistant46(anchor,startAnimation){
    const root=anchor?.root||root46();
    const layer=root?.querySelector('.ai-assistant-layer');
    const sheet=layer?.querySelector('.ai-assistant-sheet');
    if(!root||!layer||!sheet||!anchor)return;

    const rr=root.getBoundingClientRect();
    const nav=root.querySelector('.bottom-nav');
    const nr=nav?.getBoundingClientRect();
    const topBound=12;
    const bottomBound=nr?Math.max(230,nr.top-rr.top-8):rr.height-12;
    const total=Math.max(220,bottomBound-topBound);

    const width=Math.min(334,rr.width-24);
    const natural=Math.max(220,Math.min(sheet.scrollHeight||320,total));
    const gap=10;
    const below=Math.max(0,bottomBound-anchor.bottom-gap);
    const above=Math.max(0,anchor.top-topBound-gap);

    let panelH=Math.min(natural,total);
    let top;
    if(below>=Math.min(panelH,280) || below>=above){
      panelH=Math.min(panelH,Math.max(210,below));
      top=Math.min(bottomBound-panelH,Math.max(topBound,anchor.bottom+gap));
    }else{
      panelH=Math.min(panelH,Math.max(210,above));
      top=Math.max(topBound,anchor.top-gap-panelH);
    }
    if(below<210&&above<210){
      panelH=total;
      top=topBound;
    }

    const left=anchor.cx<=rr.width/2
      ? Math.min(rr.width-width-12,Math.max(12,anchor.left-8))
      : Math.min(rr.width-width-12,Math.max(12,anchor.right-width+8));

    const ox=anchor.cx-left;
    const oy=anchor.cy-top;

    sheet.style.setProperty('--ag-v2646-left',Math.round(left)+'px');
    sheet.style.setProperty('--ag-v2646-top',Math.round(top)+'px');
    sheet.style.setProperty('--ag-v2646-width',Math.round(width)+'px');
    sheet.style.setProperty('--ag-v2646-maxh',Math.round(panelH)+'px');
    sheet.style.setProperty('--ai-origin-x',Math.round(ox)+'px');
    sheet.style.setProperty('--ai-origin-y',Math.round(oy)+'px');
    sheet.style.transformOrigin=Math.round(ox)+'px '+Math.round(oy)+'px';

    if(startAnimation){
      sheet.classList.remove('ag-v2646-opening');
      void sheet.offsetWidth;
      sheet.classList.add('ag-v2646-opening');
    }
  }

  const openBefore46=window.agAiOpenAssistant;
  

  /* ---------- Re-apply after every render so no role/screen loses motion. ---------- */
  const renderBefore46=window.render;
  window.render=function(){
    const out=renderBefore46.apply(this,arguments);
    requestAnimationFrame(()=>{
      syncBottomNav46();
      enhanceButtons46(document.querySelector('.phone-screen')||document);
    });
    return out;
  };

  // Current screen may already be rendered when this patch loads.
  syncBottomNav46();
  enhanceButtons46(document.querySelector('.phone-screen')||document);

  window.addEventListener('resize',()=>{
    requestAnimationFrame(syncBottomNav46);
  });
})();
</script>

<script id="ag-v2652-shared-fullscreen-qr-js">
(function(){
  state.v2652Qr=state.v2652Qr||{
    collectionScanned:false,
    tripScanned:false,
    attendanceScanned:false,
    whOutboundScanned:false,
    whLookupScanned:false
  };

  const QR52_ICON=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><path d="M8 8h3v3H8zM13 8h3v3h-3zM8 13h3v3H8zM13 13h2v2h-2zM17 13h3M17 16h3v4h-3M13 17h2v3h-2"/></svg>`;

  function host52(){return document.getElementById('app')||document.querySelector('.phone-screen')}
  function esc52(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

  window.agQrLaunch52=function(title,copy,onclick){
    return `<button class="ag52-qr-launch" onclick="${onclick}">
      <span class="ag52-qr-launch-icon">${QR52_ICON}</span>
      <span class="ag52-qr-launch-copy"><strong>${title}</strong><span>${copy}</span></span>
      <span class="ag52-qr-launch-arrow">›</span>
    </button>`;
  };

  window.agCloseSharedQr52=function(){
    const h=host52(); if(!h)return;
    const layer=h.querySelector('.mock-scan-layer.ag52-shared-qr');
    if(layer){
      if(layer.__scanTimer)clearTimeout(layer.__scanTimer);
      layer.remove();
    }
    window.__agQr52Confirm=null;
  };

  window.agToggleQrFlash52=function(btn){
    btn?.classList.toggle('active');
    if(btn)btn.textContent=btn.classList.contains('active')?'Đèn bật':'Bật đèn';
  };

  window.agRevealSharedQr52=function(){
    const layer=host52()?.querySelector('.mock-scan-layer.ag52-shared-qr'); if(!layer)return;
    const status=layer.querySelector('.mock-scan-status');
    const result=layer.querySelector('.ag52-scan-result');
    const confirm=layer.querySelector('.ag52-scan-confirm');
    const opt=layer.__qrOptions||{};
    if(status)status.innerHTML='<span class="mock-scan-ok">✓ Đã nhận diện mã</span>';
    if(result){
      result.innerHTML=`<strong>${esc52(opt.resultTitle||'Đã nhận diện')}</strong><span>${esc52(opt.resultMeta||'Mã hợp lệ')}</span>`;
      result.classList.add('show');
    }
    if(confirm)confirm.disabled=false;
    layer.dataset.recognized='1';
  };

  window.agManualSharedQr52=function(){
    // Prototype manual-code fallback resolves to the same sample entity.
    agRevealSharedQr52();
  };

  window.agConfirmSharedQr52=function(){
    const layer=host52()?.querySelector('.mock-scan-layer.ag52-shared-qr');
    if(!layer||layer.dataset.recognized!=='1')return;
    const cb=window.__agQr52Confirm;
    if(layer.__scanTimer)clearTimeout(layer.__scanTimer);
    layer.remove();
    window.__agQr52Confirm=null;
    if(typeof cb==='function')cb();
  };

  function actuallyOpen52(options={}){
    const h=host52(); if(!h)return;
    h.querySelector('.mock-scan-layer')?.remove();

    const layer=document.createElement('div');
    layer.className='mock-scan-layer ag52-shared-qr';
    layer.__qrOptions=options;

    layer.innerHTML=`<div class="mock-scan-backdrop"></div>
      <div class="mock-scan-shell">
        <div class="mock-scan-head">
          <div class="mock-scan-head-copy">
            <strong>${esc52(options.title||'Quét mã QR')}</strong>
            <span>${esc52(options.subtitle||'AgriOS QR Scanner')}</span>
          </div>
          <button class="mock-scan-close" aria-label="Đóng máy quét" onclick="agCloseSharedQr52()">×</button>
        </div>
        <div class="mock-scan-view" onclick="agRevealSharedQr52()">
          <div class="ag52-scan-tools">
            <button class="ag52-scan-tool" onclick="event.stopPropagation();agToggleQrFlash52(this)">Bật đèn</button>
          </div>
          <div class="mock-scan-frame"><span class="ag52-scan-corners"></span></div>
        </div>
        <div class="mock-scan-status">${esc52(options.hint||'Đưa mã QR vào trong khung')}</div>
        <div class="ag52-scan-result"></div>
        <div class="ag52-scan-actions">
          <button class="ag52-scan-manual" onclick="agManualSharedQr52()">Nhập mã</button>
          <button class="ag52-scan-confirm" disabled onclick="agConfirmSharedQr52()">${esc52(options.confirmLabel||'Sử dụng mã này')}</button>
        </div>
        <div class="ag52-scan-hint">Camera toàn màn hình dùng chung cho QR doanh nghiệp, thẻ nhân sự, lô nguyên liệu, pallet và bin.</div>
      </div>`;

    h.appendChild(layer);
    window.__agQr52Confirm=options.onConfirm||null;

    const delay=Number.isFinite(options.delay)?options.delay:850;
    layer.__scanTimer=setTimeout(()=>agRevealSharedQr52(),delay);
  }

  window.agOpenSharedQr52=function(options={}){
    const open=()=>actuallyOpen52(options);
    // Camera permission is shared by every QR flow where the permission system is available.
    if(state.v2630?.permissions?.camera!=='granted' && typeof window.agRequestPermission30==='function'){
      agRequestPermission30('camera',open);
      return;
    }
    open();
  };

  /* Tenant QR now uses the exact same shared scanner component. */
  window.agTenantStartQrScan=function(){
    agOpenSharedQr52({
      title:'Quét mã doanh nghiệp',
      subtitle:'Thiết lập doanh nghiệp',
      hint:'Đưa mã QR doanh nghiệp vào trong khung',
      resultTitle:'Đồi Đẹp',
      resultMeta:'DOIDEP · Lộc Quảng · Bảo Lộc',
      confirmLabel:'Sử dụng doanh nghiệp này',
      onConfirm:()=>agTenantConfirm({code:'DOIDEP',name:'Đồi Đẹp',short:'ĐĐ',location:'Lộc Quảng · Bảo Lộc'})
    });
  };
  window.agTenantCloseQrScan=window.agCloseSharedQr52;

  /* Weighing / worker card QR. */
  window.agMockQrScan=function(){
    agOpenSharedQr52({
      title:'Quét thẻ công nhân',
      subtitle:'Cân thu hoạch',
      hint:'Đưa QR trên thẻ công nhân vào trong khung',
      resultTitle:'CN-052 · Lê Thị B',
      resultMeta:'Tổ 2 · CH-07',
      confirmLabel:'Chọn công nhân',
      onConfirm:()=>{
        state.mockWorkerCode='CN-052 · Lê Thị B';
        if(state.screen==='weighEntry')render();
      }
    });
  };
  window.agMockCloseScan=window.agCloseSharedQr52;

  /* Buyer: scan harvest lot first, then show the receiving form. */
  window.agCollectionScan52=function(){
    const entries=cropMock.collectionCandidates().filter(x=>x.grades.some(g=>!x.received.some(r=>r.grade===g.grade)));
    const item=entries.find(x=>x.batch.id===state.cropCollectionBatchId)||entries[0];
    agOpenSharedQr52({
      title:'Quét QR lô thu hoạch',
      subtitle:'Điểm gom Lộc Quảng',
      hint:'Đưa QR bàn giao của lô thu hoạch vào khung',
      resultTitle:item?.batch.id||'Kh?ng c? l? ch? nh?n',
      resultMeta:item?`${item.plot?.name||item.batch.plot_id} ? ${item.batch.harvest_kg} kg`:'Kh?ng c? l? thu ho?ch ?ang ch? nh?n',
      confirmLabel:'Nhận diện lô',
      onConfirm:()=>{state.v2652Qr.collectionScanned=true;render()}
    });
  };


  /* Driver raw-material QR. */
  window.agTripReceiveScan52=function(){
    agOpenSharedQr52({
      title:'Quét QR lô nguyên liệu',
      subtitle:'CX-0218 · Điểm gom',
      hint:'Đưa QR lô nguyên liệu vào trong khung',
      resultTitle:'NL-2026-0031',
      resultMeta:'412,4 kg · Hạng A · đúng chuyến',
      confirmLabel:'Chọn lô này',
      onConfirm:()=>{state.v2652Qr.tripScanned=true;render()}
    });
  };


  /* Attendance scanner. */
  window.agAttendanceScan52=function(){
    agOpenSharedQr52({
      title:'Quét QR chấm công',
      subtitle:'Tổ trưởng · Tổ 2',
      hint:'Đưa QR chấm công của công nhân vào trong khung',
      resultTitle:'CN-052 · Lê Thị B',
      resultMeta:'Tổ 2 · CH-07',
      confirmLabel:'Chọn công nhân',
      onConfirm:()=>{state.v2652Qr.attendanceScanned=true;state.v2617.scanResult=null;render()}
    });
  };
  const attendanceHistory52=()=>typeof historyRows==='function'?historyRows([['07:18','CN-052 · Lê Thị B','Vào ca · CH-07','Đã ghi'],['07:16','CN-049 · Trần Văn C','Vào ca · CH-07','Đã ghi'],['07:12','CN-045 · Nguyễn Văn A','Vào ca · CH-07','Đã ghi']]):'';


  /* Warehouse sequential flow: keep steps, replace mini-camera with shared full-screen scanner. */
  window.agWh52Open=function(flow,kind){
    const inbound=flow==='inbound', pallet=kind==='pallet';
    const cfg=pallet
      ? {
          title: inbound?'Quét pallet nhập kho':'Quét pallet cần chuyển',
          subtitle: inbound?'Nhập kho · Bước 1/2':'Chuyển vị trí · Bước 1/2',
          hint:'Đưa QR pallet vào trong khung',
          resultTitle:'PAL-00128',
          resultMeta:inbound?'Batch TP-2026-101 · 320 kg':'Batch TP-2026-101 · hiện tại BIN-B01-03'
        }
      : {
          title: inbound?'Quét bin đích':'Quét bin mới',
          subtitle: inbound?'Nhập kho · Bước 2/2':'Chuyển vị trí · Bước 2/2',
          hint:'Đưa QR bin vào trong khung',
          resultTitle:inbound?'BIN-B01-03':'BIN-C02-01',
          resultMeta:inbound?'Khu thành phẩm mát · hợp lệ':'Bin mới · hợp lệ'
        };
    agOpenSharedQr52({...cfg,confirmLabel:'Dùng mã này',onConfirm:()=>agWh45Scan(flow,kind)});
  };






  /* Warehouse outbound / count / lookup. */
  window.agWhOutboundScan52=function(){
    agOpenSharedQr52({title:'Quét pallet xuất kho',subtitle:'PX-1038 · FEFO',hint:'Đưa QR pallet vào trong khung',resultTitle:'PAL-00113',resultMeta:'HSD 15/11/2026 · BIN-B01-02',confirmLabel:'Chọn pallet',onConfirm:()=>{state.v2652Qr.whOutboundScanned=true;render()}});
  };


  window.agWhCountScan52=function(){
    agOpenSharedQr52({title:'Quét pallet kiểm kê',subtitle:'BIN-B01-03',hint:'Đưa QR pallet thực tế trong bin vào khung',resultTitle:`PAL-00${129+(state.v2615.whScanned||17)}`,resultMeta:'Đã thêm vào phiên kiểm kê',confirmLabel:'Ghi nhận pallet',onConfirm:()=>{state.v2615.whScanned=Math.min(18,(state.v2615.whScanned||17)+1);render()}});
  };


  window.agWhLookupScan52=function(){
    agOpenSharedQr52({title:'Quét pallet để tra cứu',subtitle:'Tra cứu kho',hint:'Đưa QR pallet vào trong khung',resultTitle:'PAL-00128',resultMeta:'Batch TP-2026-101 · BIN-B01-03',confirmLabel:'Xem pallet',onConfirm:()=>{state.v2652Qr.whLookupScanned=true;render()}});
  };


  /* Reset transient scanner result states when entering relevant workflow roots. */
  const goBefore52=window.go||go;
  window.go=go=function(screen,options){
    if(screen==='collectionReceive'&&state.screen!=='collectionReceive')state.v2652Qr.collectionScanned=false;
    if(screen==='tripReceive'&&state.screen!=='tripReceive')state.v2652Qr.tripScanned=false;
    if(screen==='attendanceScan'&&state.screen!=='attendanceScan'){state.v2652Qr.attendanceScanned=false;if(state.v2617)state.v2617.scanResult=null}
    if(screen==='whOutbound'&&state.screen!=='whOutbound')state.v2652Qr.whOutboundScanned=false;
    if(screen==='whLookup'&&state.screen!=='whLookup')state.v2652Qr.whLookupScanned=false;
    return goBefore52(screen,options);
  };

  /* Documentation metadata inside prototype. */
  if(screenMeta.tenantSetup)screenMeta.tenantSetup.reason='QR doanh nghiệp dùng Shared Full-screen QR Scanner; cùng component với các QR nghiệp vụ.';

})();

<style id="ag-v2653-contrast-and-stability">
/* v26.56 — readability recovery + stable appearance defaults. */

/* ------------------------------------------------------------------
   1) Liquid Glass readability:
   Keep the glass itself clear, but give long instructional copy a
   local readability plate so photography never competes with text.
------------------------------------------------------------------- */
.phone-screen:not(.ag-dark-theme):not(.ag-glass-off) .login-screen .tenant-setup-copy{
  margin:8px 0 11px!important;
  padding:8px 10px!important;
  border:1px solid rgba(255,255,255,.52)!important;
  border-radius:10px!important;
  background:rgba(250,253,251,.58)!important;
  color:#102219!important;
  font-weight:600!important;
  line-height:1.48!important;
  text-shadow:0 1px 1px rgba(255,255,255,.82)!important;
  backdrop-filter:blur(8px) saturate(118%)!important;
  -webkit-backdrop-filter:blur(8px) saturate(118%)!important;
}
.phone-screen:not(.ag-dark-theme):not(.ag-glass-off) .login-screen .tenant-setup-note{
  background:rgba(250,253,251,.62)!important;
  border-color:rgba(255,255,255,.56)!important;
  color:#102219!important;
  box-shadow:0 1px 0 rgba(255,255,255,.62) inset!important;
  backdrop-filter:blur(8px) saturate(118%)!important;
  -webkit-backdrop-filter:blur(8px) saturate(118%)!important;
}
.phone-screen:not(.ag-dark-theme):not(.ag-glass-off) .login-screen .tenant-setup-note span{
  color:#102219!important;
  font-weight:650!important;
  text-shadow:0 1px 1px rgba(255,255,255,.82)!important;
}
.phone-screen:not(.ag-dark-theme):not(.ag-glass-off) .login-screen .tenant-manual-label,
.phone-screen:not(.ag-dark-theme):not(.ag-glass-off) .login-screen .tenant-method-separator span,
.phone-screen:not(.ag-dark-theme):not(.ag-glass-off) .login-screen .login-float-field label{
  color:#183328!important;
  font-weight:700!important;
  text-shadow:0 1px 1px rgba(255,255,255,.64)!important;
}

/* Dark glass uses the inverse readability plate. */
.phone-screen.ag-dark-theme:not(.ag-glass-off) .login-screen .tenant-setup-copy{
  margin:8px 0 11px!important;
  padding:8px 10px!important;
  border:1px solid rgba(255,255,255,.14)!important;
  border-radius:10px!important;
  background:rgba(5,14,10,.54)!important;
  color:#F4F8F5!important;
  font-weight:600!important;
  line-height:1.48!important;
  text-shadow:0 1px 2px rgba(0,0,0,.55)!important;
  backdrop-filter:blur(8px) saturate(112%)!important;
  -webkit-backdrop-filter:blur(8px) saturate(112%)!important;
}
.phone-screen.ag-dark-theme:not(.ag-glass-off) .login-screen .tenant-setup-note{
  background:rgba(5,14,10,.58)!important;
  border-color:rgba(255,255,255,.14)!important;
  color:#F4F8F5!important;
  backdrop-filter:blur(8px) saturate(112%)!important;
  -webkit-backdrop-filter:blur(8px) saturate(112%)!important;
}
.phone-screen.ag-dark-theme:not(.ag-glass-off) .login-screen .tenant-setup-note span,
.phone-screen.ag-dark-theme:not(.ag-glass-off) .login-screen .tenant-manual-label,
.phone-screen.ag-dark-theme:not(.ag-glass-off) .login-screen .tenant-method-separator span,
.phone-screen.ag-dark-theme:not(.ag-glass-off) .login-screen .login-float-field label{
  color:#F4F8F5!important;
  text-shadow:0 1px 2px rgba(0,0,0,.55)!important;
}

/* Glass OFF is now the default and should look like a normal solid form. */
.phone-screen.ag-glass-off:not(.ag-dark-theme) .login-screen .tenant-setup-copy{
  color:#3C4A41!important;
  text-shadow:none!important;
}
.phone-screen.ag-glass-off:not(.ag-dark-theme) .login-screen .tenant-setup-note{
  background:#F4F8F5!important;
  color:#24372C!important;
  border-color:#D4DED7!important;
  backdrop-filter:none!important;
  -webkit-backdrop-filter:none!important;
}
.phone-screen.ag-glass-off:not(.ag-dark-theme) .login-screen .tenant-setup-note span{
  color:#24372C!important;
  text-shadow:none!important;
}

/* Defensive contrast for long helper text across auth states. */
.phone-screen .login-screen .tenant-setup-copy,
.phone-screen .login-screen .tenant-setup-note,
.phone-screen .login-screen .tenant-setup-note span{
  opacity:1!important;
}

/* ------------------------------------------------------------------
   2) Runtime error fallback inside the prototype itself.
   If a screen renderer throws, show a useful in-app diagnostic instead
   of leaking the host visualization error.
------------------------------------------------------------------- */

<script id="ag-v2653-navigation-runtime-fix">
(function(){
  /* ================================================================
     A. Default appearance migration
     v26.56 default = Light Mode; Dark Mode remains user-selectable. Liquid Glass is retired.
     Apply once per browser/profile, then preserve subsequent choices.
     ================================================================ */
  try{
    const migrationKey='agrios-v2653-default-appearance.agronomist';
    if(!localStorage.getItem(migrationKey)){
      state.v2638=state.v2638||{};
      state.v2638.theme='light';
      state.v2638.glass=false;
      localStorage.setItem('agrios-theme.agronomist','light');
      localStorage.setItem('agrios-glass.agronomist','off');
      localStorage.setItem(migrationKey,'1');
    }
  }catch(e){
    state.v2638=state.v2638||{};
    if(!state.v2638.theme)state.v2638.theme='light';
    if(typeof state.v2638.glass!=='boolean')state.v2638.glass=false;
  }

  /* ================================================================
     B. Warehouse helpers are defined in THIS scope.
     v26.52 referenced private v26.45 helpers from a later script,
     which could throw ReferenceError during whInbound / whMove render.
     ================================================================ */
  function wh53State(){
    state.v2645Warehouse=state.v2645Warehouse||{inboundStep:1,inboundDone:false,moveStep:1,moveDone:false};
    return state.v2645Warehouse;
  }





  /* ================================================================
     C. Canonical navigation.
     - QR workflow screens no longer request Camera just to ENTER.
       Permission is requested when the shared QR scanner is opened.
     - Browser/device Back performs a real history.back(), so one press
       equals one navigation step.
     - Root tab navigation replaces the current history entry.
     ================================================================ */
  function ag53ResetEntry(screen){
    const s=wh53State();
    state.v2652Qr=state.v2652Qr||{};
    if(screen==='whInbound'&&state.screen!=='whInbound'){s.inboundStep=1;s.inboundDone=false}
    if(screen==='whMove'&&state.screen!=='whMove'){s.moveStep=1;s.moveDone=false}
    if(screen==='collectionReceive'&&state.screen!=='collectionReceive')state.v2652Qr.collectionScanned=false;
    if(screen==='tripReceive'&&state.screen!=='tripReceive')state.v2652Qr.tripScanned=false;
    if(screen==='attendanceScan'&&state.screen!=='attendanceScan'){
      state.v2652Qr.attendanceScanned=false;
      if(state.v2617)state.v2617.scanResult=null;
    }
    if(screen==='whOutbound'&&state.screen!=='whOutbound')state.v2652Qr.whOutboundScanned=false;
    if(screen==='whLookup'&&state.screen!=='whLookup')state.v2652Qr.whLookupScanned=false;
  }

  window.go=go=function(screen,options){
    if(!screenMeta[screen]||!canAccess(screen)||screen===state.screen)return;

    /* Photo capture still needs Camera permission before entering.
       QR pages themselves do not; the full-screen scanner asks on demand. */
    if(screen==='photoCapture'&&state.v2630?.permissions?.camera!=='granted'&&typeof agRequestPermission30==='function'){
      agRequestPermission30('camera',()=>go(screen,options));
      return;
    }

    ag53ResetEntry(screen);
    if(screen==='photoCapture'){state.photoContext=state.screen;state.photoReady=false}
    __cancelSplashSequence();
    __pendingMotion='forward';

    if(!navigationStack.length||navigationStack[navigationStack.length-1]!==state.screen){
      navigationStack.push(state.screen);
    }
    state.screen=screen;
    syncBrowserHistory('push');
    render();
  };

  window.goRoot=goRoot=function(screen){
    if(!screenMeta[screen]||!canAccess(screen)||screen===state.screen)return;
    __cancelSplashSequence();
    __pendingMotion='tab';
    navigationStack=[];
    state.screen=screen;
    /* Tabs/root destinations should not create invisible duplicate Back steps. */
    syncBrowserHistory('replace');
    render();
  };

  window.goBack=goBack=function(){
    __cancelSplashSequence();
    __pendingMotion='back';

    if(navigationStack.length){
      /* Real browser-history traversal fixes the old "press Back twice" symptom. */
      history.back();
      return;
    }

    const fallback=defaultScreenForRole[state.role];
    if(state.screen!==fallback){
      state.screen=fallback;
      syncBrowserHistory('replace');
      render();
    }
  };

  /* Capture-phase handler supersedes the older anonymous popstate listener. */
  window.addEventListener('popstate',function ag53PopState(event){
    const target=event.state&&event.state.agrios?event.state.screen:null;
    if(!target||!screenMeta[target]||!canAccess(target))return;

    event.stopImmediatePropagation();
    __cancelSplashSequence();
    __pendingMotion='back';

    if(navigationStack.length){
      const expected=navigationStack[navigationStack.length-1];
      if(expected===target){
        navigationStack.pop();
      }else{
        const idx=navigationStack.lastIndexOf(target);
        if(idx>=0)navigationStack=navigationStack.slice(0,idx);
        else navigationStack=[];
      }
    }
    state.screen=target;
    render();
  },true);

  /* ================================================================
     D. Runtime-safe render wrapper.
     Catch any screen renderer exception so the prototype remains usable
     and the host does not collapse into a generic visualization error.
     ================================================================ */
  const renderBefore53=window.render;
  window.render=function(){
    try{
      return renderBefore53.apply(this,arguments);
    }catch(err){
      console.error('[AgriOS v26.56 render]',state?.role,state?.screen,err);
      const host=document.getElementById('app')||document.querySelector('.phone-screen');
      if(host){
        host.innerHTML=`<div class="ag53-runtime-error"><strong>Không thể hiển thị màn này</strong><span>${String(err&&err.message||err)}</span></div>`;
        host.setAttribute('data-screen',state?.screen||'error');
      }
    }
  };

  /* Apply migrated default immediately to the already-rendered shell. */
  requestAnimationFrame(()=>{
    try{render()}catch(e){console.error(e)}
  });
})();
</script>

  };

  /* M08 driver directions: direct OS-map handoff, AI remains optional lookup only. */
  window.ag55DriverDirections=function(){

  /* M10 QC: choosing a result different from the server recommendation requires a reason. */
  window.ag55QcChoose=function(d){state.v2615.qcDecision=d;state.v2655.qcDone=null;render()};
  window.ag55QcConfirm=function(d){

  window.ag55WhOutboundConfirm=function(){if(!state.v2652Qr?.whOutboundScanned)return;state.v2655.whOutboundDone=true;render()};

  /* Metadata used by the prototype directory/review mode. */
  if(screenMeta?.harvestQr)screenMeta.harvestQr.purpose='Hiện QR thật của lô thu hoạch để bàn giao cho điểm gom.';

  if(screenMeta?.qcDecision)screenMeta.qcDecision.purpose='Quality Gate với lý do bắt buộc nếu chọn khác đề xuất server.';
  try{render()}catch(e){console.error('[AgriOS v26.56 completion]',e)}

<script id="ag-v2656-remove-liquid-glass-ui">
(function(){
  function retireGlassUI(){
    try{localStorage.removeItem('agrios-glass.agronomist')}catch(e){}
    const root=document.querySelector('.phone-screen');
    if(root) root.classList.add('ag-glass-off');
    document.querySelectorAll('.ag-appearance-floating .ag-appearance-row').forEach(row=>{
      if(/glass/i.test(row.textContent||'')) row.remove();
    });
    document.querySelectorAll('.ag-appearance-card .ag-appearance-setting').forEach(row=>{
      if(/liquid\s*glass|glass/i.test(row.textContent||'')) row.remove();
    });
  }
  const before=window.render;
  if(typeof before==='function'){
    window.render=function(){
      const out=before.apply(this,arguments);
      retireGlassUI();
      requestAnimationFrame(retireGlassUI);
      return out;
    };
  }
  retireGlassUI();
  requestAnimationFrame(retireGlassUI);
})();
</script>

<script id="ag-v2656-photo-evidence-clarity">
(function(){
  state.v2656DiaryPhotos=state.v2656DiaryPhotos||{before:0,during:0,after:0};
  const photoMeta={
    before:{label:'Trước',short:'Hiện trạng',title:'Trước khi làm',help:'Ghi lại hiện trạng lô hoặc khu vực trước khi bắt đầu công việc.'},
    during:{label:'Trong',short:'Quá trình',title:'Trong khi làm',help:'Ghi lại công việc đang được thực hiện để làm bằng chứng quá trình.'},
    after:{label:'Sau',short:'Kết quả',title:'Sau khi làm',help:'Ghi lại kết quả sau khi hoàn thành để đối chiếu với hiện trạng ban đầu.'}
  };
  window.v2615PhotoGroup=function(g){if(!photoMeta[g])return;state.v2615=state.v2615||{};state.v2615.photoGroup=g;render();};
  window.v2615TakePhoto=function(){
    const g=(state.v2615&&photoMeta[state.v2615.photoGroup])?state.v2615.photoGroup:'during';
    state.v2656DiaryPhotos[g]=Math.min(3,(state.v2656DiaryPhotos[g]||0)+1);
    render();
  };
  window.v2656RemoveLastPhoto=function(g){
    if(!photoMeta[g])return;
    state.v2656DiaryPhotos[g]=Math.max(0,(state.v2656DiaryPhotos[g]||0)-1);
    render();
  };
  screens.photoCapture=function(){
    state.v2615=state.v2615||{};
    const g=photoMeta[state.v2615.photoGroup]?state.v2615.photoGroup:'during';
    const p=state.v2656DiaryPhotos;
    const meta=photoMeta[g];
    const tabs=['before','during','after'].map(x=>`<button class="v2615-photo-tab ${g===x?'active':''}" onclick="v2615PhotoGroup('${x}')"><strong>${photoMeta[x].label}</strong><span>${photoMeta[x].short} · ${p[x]||0}/3</span></button>`).join('');
    const count=p[g]||0;
    const slots=[0,1,2].map((_,i)=>{
      if(i<count)return `<button class="v2615-photo-slot done" onclick="v2656RemoveLastPhoto('${g}')">✓ Ảnh ${i+1}<small>Nhấn để bỏ ảnh cuối</small></button>`;
      if(i===count)return `<button class="v2615-photo-slot" onclick="v2615TakePhoto()">+ Chụp ảnh</button>`;
      return `<div class="v2615-photo-slot locked">Ảnh ${i+1}</div>`;
    }).join('');
    const total=(p.before||0)+(p.during||0)+(p.after||0);
    return appShell(`<div class="banner info"><strong>Ảnh bằng chứng theo thời điểm</strong>Ba nhóm Trước / Trong / Sau là cách phân loại ảnh, không phải ba bước bắt buộc.</div><div class="v2615-photo-tabs">${tabs}</div><div class="v2656-photo-purpose"><strong>${meta.title}</strong><span>${meta.help}</span></div><div class="v2615-photo-grid">${slots}</div><div class="v2615-alert"><strong>Quy tắc ảnh</strong><span>Tùy loại công việc, hệ thống có thể yêu cầu một hoặc nhiều nhóm ảnh. Mỗi nhóm tối đa 3 ảnh trong prototype. Ảnh chỉ chụp trực tiếp trong AgriOS và được gắn thời điểm, vị trí, người chụp.</span></div><div class="v2656-photo-total">Đã chụp ${total} ảnh · Trước ${p.before||0} · Trong ${p.during||0} · Sau ${p.after||0}</div><button class="btn primary block" style="margin-top:12px" onclick="goBack()">Xong · lưu ảnh vào nhật ký</button>`,{title:'Ảnh bằng chứng',subtitle:meta.title});
  };
})();
</script>

<script id="ag-v2657-state-postprocess">
(function(){
  const ICONS = {
    pending:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="8.5"/></svg>`,
    sending:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V8"/><path d="m8.5 11.5 3.5-3.5 3.5 3.5"/><path d="M5 18.5h14"/></svg>`,
    error:`<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>`,
    done:`<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m8.5 12.2 2.2 2.3 4.8-5"/></svg>`
  };
  const STATE_RULES = [
    ['pending', /(chờ gửi|chờ mạng)/i],
    ['sending', /(đang gửi|đang đồng bộ)/i],
    ['error', /(lỗi|cần xử lý)/i],
    ['done', /(đã gửi|đồng bộ xong|thành công)/i],
  ];
  function inferState(text=''){
    for(const [key,rx] of STATE_RULES){ if(rx.test(text)) return key; }
    return '';
  }
  function decorateStatusCards(root){
    root.querySelectorAll('.kpi-card,.v2615-stat').forEach(card=>{
      const label = card.querySelector('.label')?.textContent || card.querySelector('span:last-child')?.textContent || card.textContent || '';
      const state = inferState(label);
      card.classList.remove('ag-status-card--pending','ag-status-card--sending','ag-status-card--error','ag-status-card--done');
      if(state) card.classList.add(`ag-status-card--${state}`);
    });
  }
  function decorateSyncIcons(root){
    root.querySelectorAll('.sync-icon').forEach(node=>{
      const itemText = node.closest('.list-item')?.textContent || node.parentElement?.textContent || '';
      const state = inferState(itemText) || (/ảnh bằng chứng/i.test(itemText) ? 'error' : 'pending');
      if(node.dataset.agStatusIcon !== state){node.innerHTML = ICONS[state] || ICONS.pending;node.dataset.agStatusIcon = state;}
      node.style.background = state==='pending' ? 'var(--warn-bg)' : state==='sending' ? 'var(--info-bg)' : state==='error' ? 'var(--danger-bg)' : 'var(--ok-bg)';
      node.style.color = state==='pending' ? 'var(--warn-fg)' : state==='sending' ? 'var(--info-fg)' : state==='error' ? 'var(--danger-fg)' : 'var(--ok-fg)';
      node.style.border = '1px solid rgba(20,35,27,.08)';
    });
  }
  function enhance(){
    const root = document.getElementById('app') || document;
    decorateStatusCards(root);
    decorateSyncIcons(root);
  }
  function install(){
    enhance();
    const app = document.getElementById('app');
    if(!app || app.__agFixObserver) return;
    const obs = new MutationObserver(()=>enhance());
    obs.observe(app,{childList:true,subtree:true});
    app.__agFixObserver = obs;
  }
  window.addEventListener('load', install);
  setTimeout(install, 0);
})();
</script>
