      {title:'Nhận NL-2026-0031',meta:'Điểm gom Lộc Quảng',badge:'Tiếp theo',tone:'warn',screen:'tripDetail',icon:'check'},
      {title:'Theo dõi SLA',meta:'Còn 01:42:18',badge:'Theo dõi',tone:'ok',screen:'tripDetail',icon:'clipboard'}
    ];
    if(role==='qc') return [
      {title:'NL-2026-0031 chờ QC',meta:'Incoming QC · 1 mẫu',badge:'Chờ QC',tone:'info',screen:'qcQueue',icon:'check'},
      {title:'NL-00129 đang HOLD',meta:'Chờ thêm chỉ tiêu lab',badge:'HOLD',tone:'warn',screen:'qcQueue',icon:'clipboard'},
      {title:'Phiếu QC mới',meta:'Mở nhanh để nhập chỉ tiêu',badge:'Nhập liệu',tone:'ok',screen:'qcForm',icon:'diary'}
    ];
    return [
      {title:'Nhập kho PAL-00128',meta:'Cần quét pallet và bin',badge:'Nhập',tone:'info',screen:'whInbound',icon:'box'},
      {title:'PX-1038 cần xuất',meta:'1 pallet theo gợi ý FEFO',badge:'Xuất',tone:'warn',screen:'whOutbound',icon:'clipboard'},
      {title:'Kiểm kê BIN-B01-03',meta:'17/18 pallet đã quét',badge:'Kiểm kê',tone:'ok',screen:'whCount',icon:'check'}
    ];
  };
  const todaySection=(role)=>`${section('Việc hôm nay',role==='driver'?'tripList':role==='buyer'?'collectionHome':role==='qc'?'qcQueue':role==='warehouse'?'warehouseHome':'myTasks')}<div class="v2616-task-list">${todayItems(role).slice(0,3).map(taskCard).join('')}</div><div class="v2616-open-all"><button class="btn secondary block" onclick="go('${role==='driver'?'tripList':role==='buyer'?'collectionHome':role==='qc'?'qcQueue':role==='warehouse'?'warehouseHome':'myTasks'}')">Mở tất cả công việc</button></div>`;
  const quicks=(role)=>{
    if(role==='worker') return `${q('diaryCreate','diary','Ghi nhật ký')}${q('myTasks','clipboard','Việc hôm nay')}${q('plotDetail','plot','Hồ sơ lô')}${allBtn()}`;
    if(role==='leader') return `${q('harvestList','harvest','Thu hoạch')}${q('myTasks','clipboard','Việc hôm nay')}${q('attendanceScan','check','Chấm công hộ')}${allBtn()}`;
    if(role==='agronomist') return `${q('diaryApproval','check','Cần duyệt')}${q('myTasks','clipboard','Việc hôm nay')}${q('plots','plot','Hồ sơ lô')}${allBtn()}`;
    if(role==='manager') return `${q('managerOps','check','Điều hành')}${q('myTasks','clipboard','Tiến độ tổ')}${q('harvestList','harvest','Thu hoạch')}${allBtn()}`;
    if(role==='buyer') return `${q('collectionHome','harvest','Điểm gom')}${q('rawBatch','box','Lô nguyên liệu')}${q('plotDetail','plot','Hồ sơ lô')}${allBtn()}`;
    if(role==='driver') return `${q('tripList','box','Chuyến xe')}${q('notifications','bell','Thông báo')}${q('account','user','Tài khoản')}${allBtn()}`;
    if(role==='qc') return `${q('qcQueue','check','Hàng chờ QC')}${q('qcForm','diary','Phiếu QC')}${q('notifications','bell','Thông báo')}${allBtn()}`;
    return `${q('warehouseHome','box','Kho')}${q('whLookup','check','Tra cứu')}${q('notifications','bell','Thông báo')}${allBtn()}`;
  };

  window.agAiAssistantCard=function(){
    const common=[`Tôi còn việc gì hôm nay?`,`Mở hồ sơ lô CH-07`,`Tôi còn bản nào chưa gửi?`];
    if(state.role==='leader') common.unshift(`Cân CN045 tổng 31 ký 8, bì 1 ký 2, hạng A`);
    else if(['worker','agronomist'].includes(state.role)) common.unshift(`Ghi nhật ký chăm sóc lô CH-07 từ 8 giờ 10 đến 9 giờ 20`);
    else if(state.role==='manager') common.unshift(`Hôm nay có gì cần chú ý?`);
    return `<div class="ai-entry-card"><div class="ai-entry-row"><button class="ai-mic-orb" aria-label="Mở Trợ lý AgriOS" onclick="agAiOpenAssistant()">${micSvg2616}</button><div class="grow"><div class="ai-entry-title">Trợ lý AgriOS</div><div class="ai-entry-copy">Ghi nhật ký, hỏi việc hôm nay hoặc mở nhanh màn hình nghiệp vụ. Trợ lý chỉ hỗ trợ nhập liệu và tra cứu.</div></div><button class="btn secondary small" onclick="agAiOpenAssistant()">Nói</button></div><div class="ai-entry-examples">${common.map(x=>`<button class="ai-example-chip" onclick="agAiOpenAssistant(${JSON.stringify(x).replace(/"/g,'&quot;')})">${esc(x)}</button>`).join('')}</div></div>`;
  };

  screens.login=function(){
    if(!state.tenantConfigured) return screens.tenantSetup();
    const t={code:state.tenantCode||'DOIDEP',name:state.tenantName||'Đồi Đẹp',short:state.tenantShort||(state.tenantName||'Đồi Đẹp').slice(0,2).toUpperCase(),location:(state.tenantCode||'DOIDEP')==='DOIDEP'?'Lộc Quảng · Bảo Lộc':'Doanh nghiệp đã chọn'};
    return `<div class="login-screen"><div class="auth-photo-overlay"></div><div class="login-center auth-stable"><div class="login-brand-centered"><div class="splash-mark login-mark"><svg class="ag-brand-symbol" viewBox="0 0 64 64" aria-hidden="true"><path class="ag-logo-main" d="M8.5 52.5 25.4 15.2C26.8 12.2 29.1 10.8 32 10.8s5.2 1.4 6.6 4.4l4 8.7c4.4-4.7 9.5-7.5 15.6-8.2-.8 10.7-5.7 18.3-14.3 22.1l6.7 14.7H40l-4.1-10.1H25.1l-4.3 10.1H8.5Z"/><path class="ag-logo-cut" d="M28.2 34.5h6.1L31.3 27l-3.1 7.5Z"/><path class="ag-logo-leaf-highlight" d="M42 31.9c4-4.5 8.7-7.8 14.1-10.4-1.8 5.6-5.4 10.2-10.8 13.1L42 31.9Z"/><path class="ag-logo-vein" d="M41.4 34.2c4.8-5.1 9.3-8.7 14.3-11.9"/><path class="ag-logo-field" d="M16.2 49.8c7.2-4.2 14.1-4.7 20.7-1.5"/></svg></div><div class="login-wordmark">AgriOS</div><div class="login-kicker">Ứng dụng nông trường</div></div><div class="login-panel auth-panel"><div class="login-title">Đăng nhập</div><div class="v2616-tenant-card"><div class="v2616-tenant-main"><div class="v2616-tenant-badge">${esc(t.short)}</div><div class="v2616-tenant-copy"><div class="v2616-tenant-top"><strong>${esc(t.name)}</strong><span class="v2616-tenant-code">${esc(t.code||'DOIDEP')}</span></div><div class="v2616-tenant-meta">${esc(t.location)}</div></div></div><button class="v2616-tenant-change" onclick="agTenantChange()">Đổi</button></div><div class="form-stack"><div class="login-float-field"><input id="loginIdentity" value="" placeholder=" " aria-label="Email" autocomplete="username"><label for="loginIdentity">Email</label></div><div class="login-float-field"><input id="loginPassword" type="password" value="" placeholder=" " aria-label="Mật khẩu" autocomplete="current-password"><label for="loginPassword">Mật khẩu</label><button type="button" class="password-toggle" aria-label="Hiện mật khẩu" onclick="togglePasswordVisibility(this)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.7"/></svg></button></div><button class="btn primary block" onclick="enterAppWithLoading()">Đăng nhập</button></div></div></div></div>`;
  };

  screens.today=function(){
    let body=aiCard();
    if(state.role==='worker') body+=`<div class="card home-primary"><div class="home-kicker">Ưu tiên hôm nay</div><div class="home-title">3 việc · 1 quá hạn</div><div class="home-copy">Mở việc được giao, ghi nhật ký và chấm công ngay tại lô.</div><button class="btn primary block" style="margin-top:10px" onclick="go('myTasks')">Mở Việc hôm nay</button></div>`;
    else if(state.role==='leader') body+=`<div class="card home-primary"><div class="home-kicker">Công việc chính</div><div class="home-title">TH-0310-07 đang mở</div><div class="home-copy">3 lần cân · 92,6 kg tịnh. Theo dõi mục tiêu và chấm công hộ ngay tại hiện trường.</div><button class="btn primary block" style="margin-top:10px" onclick="go('weighing')">Tiếp tục cân</button></div>`;
    else if(state.role==='agronomist') body+=`<div class="card home-primary"><div class="home-kicker">Cần xử lý</div><div class="home-title">3 nhật ký chờ duyệt B1</div><div class="home-copy">Kiểm tra nội dung, ảnh và vị trí trước khi duyệt hoặc yêu cầu bổ sung.</div><button class="btn primary block" style="margin-top:10px" onclick="go('diaryApproval')">Bắt đầu duyệt</button></div>`;
    else if(state.role==='manager') body+=`<div class="card home-primary"><div class="home-kicker">Điều hành</div><div class="home-title">4 nhóm cần chú ý</div><div class="home-copy">Quá hạn · lệch cân · cách ly · duyệt bước 2.</div><button class="btn primary block" style="margin-top:10px" onclick="go('managerOps')">Xem điều hành hôm nay</button></div>`;
    else if(state.role==='buyer') body+=`<div class="card home-primary"><div class="home-kicker">Điểm gom Lộc Quảng</div><div class="home-title">4 lô đang chờ nhận</div><div class="home-copy">Quét QR lô thu hoạch, cân lại và đóng lô nguyên liệu.</div><button class="btn primary block" style="margin-top:10px" onclick="go('collectionHome')">Mở Điểm gom</button></div>`;
    else if(state.role==='driver') body+=`<div class="card home-primary"><div class="home-kicker">Chuyến hôm nay</div><div class="home-title">CX-0218 · 2 điểm gom · 3 lô</div><div class="home-copy">Theo dõi lộ trình, nhận hàng và kiểm soát SLA tươi.</div><button class="btn primary block" style="margin-top:10px" onclick="go('tripDetail')">Mở chuyến</button></div>`;
    else if(state.role==='qc') body+=`<div class="card home-primary"><div class="home-kicker">QC đầu vào</div><div class="home-title">3 lô chờ QC · 1 HOLD</div><div class="home-copy">Nhập chỉ tiêu, xem gợi ý và chọn quyết định Quality Gate.</div><button class="btn primary block" style="margin-top:10px" onclick="go('qcQueue')">Mở hàng chờ QC</button></div>`;
    else body+=`<div class="card home-primary"><div class="home-kicker">Kho</div><div class="home-title">Quét để thao tác nhanh</div><div class="home-copy">Nhập · chuyển · xuất · kiểm kê · tra cứu ngay trên thiết bị.</div><button class="btn primary block" style="margin-top:10px" onclick="go('warehouseHome')">Mở Kho</button></div>`;
    body+=todaySection(state.role);
    body+=`${section('Thao tác nhanh')}<div class="v2616-quick-grid">${quicks(state.role)}</div>`;
    return appShell(`<div class="v2616-home">${body}</div>`,{title:'Trang chính',subtitle:roles[state.role].name});
  };
})();
</script>


<style id="ag-v2617-system-refresh">
/* v26.56 — component-system refresh aligned to AgriOS design-system */
:root{
  --font-ui:"Be Vietnam Pro",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html,body,button,input,select,textarea{font-family:var(--font-ui)!important}
.mono,.num,.kpi-card .value,.v2615-stat b,.prod-value,.attendance-time,.v2617-code{font-family:var(--font-mono)!important;font-variant-numeric:tabular-nums}

/* 1) Loading: the logo + label + percent are one centered cluster independent of skeleton. */
.leaf-loading-box{
  width:210px!important;height:218px!important;min-height:218px!important;padding:0!important;
  position:absolute!important;left:50%!important;top:50%!important;transform:translate(-50%,-50%)!important;
  display:block!important;border-radius:20px!important;background:#fff!important;border:1px solid var(--border)!important;
  box-shadow:0 16px 36px rgba(20,35,27,.11)!important;
}
.leaf-loading-core{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:162px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;
}
.leaf-loading-core .leaf-progress-logo{width:62px!important;height:62px!important;margin:0!important;display:block}
.leaf-loading-core .leaf-loading-label{max-width:158px!important;font-size:13px!important;line-height:1.4!important;font-weight:700!important;margin:0!important}
.leaf-loading-core .leaf-loading-percent{font-size:11px!important;font-weight:700!important;margin:0!important;color:var(--primary)!important}
.leaf-loading-box .leaf-skeleton{position:absolute!important;left:16px!important;right:16px!important;bottom:15px!important;width:auto!important;margin:0!important}

/* 2) AI assistant becomes a sticky operational helper below the header. */
.mobile-content .ai-entry-card{
  position:sticky!important;top:0!important;z-index:32!important;margin:0 0 12px!important;
  border-radius:14px!important;background:#F8FBF9!important;border:1px solid #BFCFC6!important;
  box-shadow:0 8px 18px rgba(20,35,27,.10)!important;overflow:visible!important;
}
.mobile-content .ai-entry-card::before{width:3px!important;border-radius:14px 0 0 14px}
.mobile-content .ai-entry-card::after{
  content:"";position:absolute;left:12px;right:12px;bottom:-8px;height:8px;
  background:linear-gradient(180deg,rgba(244,248,245,.72),rgba(244,248,245,0));pointer-events:none;
}
.ai-entry-copy{max-width:100%;}
.ai-mic-orb{animation:v2617-mic-breathe 2.9s ease-in-out infinite}
@keyframes v2617-mic-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.ai-mic-orb.listening{animation:v2617-mic-listen .72s ease-in-out infinite alternate!important}
@keyframes v2617-mic-listen{from{transform:scale(.97)}to{transform:scale(1.07)}}

/* 3) Bottom nav sliding active green area. */
.bottom-nav{grid-template-columns:repeat(4,1fr)!important;position:absolute!important;overflow:hidden!important;padding:7px 5px 8px!important}
.bottom-nav .nav-active-slider{
  position:absolute;z-index:0;top:7px;bottom:8px;left:5px;
  left:5px!important;width:calc((100% - 10px)/var(--nav-count))!important;border-radius:14px;background:var(--nav-active-bg);
  border:1px solid #C7E2D3;transform:translateX(calc(var(--nav-to)*100%));
  animation:v2617-nav-slide .28s cubic-bezier(.2,.8,.2,1) both!important;pointer-events:none;
}
@keyframes v2617-nav-slide{from{transform:translateX(calc(var(--nav-from)*100%))}to{transform:translateX(calc(var(--nav-to)*100%))}}
.bottom-nav button{position:relative;z-index:1;border-radius:12px!important;transition:color .2s ease,transform .2s ease;background:transparent!important}
.bottom-nav button.active{background:transparent!important;color:var(--nav-active-text)!important;font-weight:700!important}
.bottom-nav button.active .nav-icon{transform:translateY(-1px) scale(1.04)}
.bottom-nav button.active::before{display:none!important}

/* 4) All-functions directory — compact cards, icons, no redundant module/open text. */
.v2617-function-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.v2617-function-card{
  appearance:none;min-height:86px;border:1px solid #C7D3CC;border-radius:14px;background:#fff;padding:11px;
  display:grid;grid-template-columns:36px minmax(0,1fr) 16px;gap:9px;align-items:center;text-align:left;color:var(--text);font:inherit;
}
.v2617-function-card:active{transform:translateY(1px)}
.v2617-function-icon{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--primary-tint);color:var(--primary)}
.v2617-function-icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.v2617-function-title{font-size:12px;font-weight:700;line-height:1.35;color:var(--text)}
.v2617-function-arrow{font-size:19px;color:#73837A;justify-self:end}
.v2617-directory-note{margin:0 0 11px;font-size:11px;line-height:1.5;color:var(--text-muted)}

/* 5) Rich productivity visual language. */
.prod-hero{border:1px solid #BDD0C4;border-radius:16px;background:#fff;padding:15px;display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:12px;align-items:center}
.prod-kicker{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.prod-value{font-size:34px;font-weight:700;line-height:1;color:var(--text);margin-top:5px}
.prod-unit{font-family:var(--font-ui);font-size:13px;font-weight:600;color:var(--text-muted);margin-left:3px}
.prod-delta{display:inline-flex;margin-top:8px;padding:4px 8px;border-radius:999px;background:var(--ok-bg);color:var(--ok-fg);font-size:10px;font-weight:700}
.prod-ring{width:88px;height:88px;position:relative;display:grid;place-items:center}
.prod-ring svg{width:88px;height:88px;transform:rotate(-90deg)}
.prod-ring .track{fill:none;stroke:#E7EDE9;stroke-width:8}.prod-ring .fill{fill:none;stroke:var(--primary);stroke-width:8;stroke-linecap:round}
.prod-ring-copy{position:absolute;text-align:center}.prod-ring-copy strong{display:block;font:700 17px/1 var(--font-mono)}.prod-ring-copy span{display:block;font-size:9px;color:var(--text-muted);margin-top:4px}
.prod-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.prod-metric{border:1px solid var(--border);border-radius:12px;background:#fff;padding:10px}.prod-metric strong{display:block;font:700 16px/1.1 var(--font-mono)}.prod-metric span{display:block;font-size:9.5px;line-height:1.35;color:var(--text-muted);margin-top:5px}
.prod-card{border:1px solid var(--border);border-radius:14px;background:#fff;padding:13px;margin-top:10px}.prod-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.prod-card-head strong{font-size:13px}.prod-card-head span{font-size:10px;color:var(--text-muted)}
.prod-stack{height:12px;border-radius:999px;overflow:hidden;display:flex;background:#E7EDE9;margin-top:12px}.prod-stack i{display:block;height:100%}.prod-stack .a{background:var(--primary)}.prod-stack .b{background:#A9DCC0}.prod-stack .c{background:#F1C46A}
.prod-legend{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}.prod-legend div{font-size:9.5px;color:var(--text-muted)}.prod-legend b{display:block;font-size:11px;color:var(--text);margin-bottom:2px}
.week-bars{height:96px;display:flex;align-items:flex-end;gap:7px;margin-top:12px}.week-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}.week-bar i{width:100%;max-width:24px;border-radius:5px 5px 2px 2px;background:#A9DCC0;border:1px solid #91CAB0}.week-bar.active i{background:var(--primary);border-color:var(--primary)}.week-bar span{font-size:8.5px;color:var(--text-muted)}
.earn-card{border:1px solid #E4C79F;border-radius:14px;background:#FFF9F1;padding:13px;margin-top:10px}.earn-card .amount{font:700 24px/1 var(--font-mono);color:#70450C}.earn-card .copy{font-size:10px;line-height:1.5;color:#7B5A2B;margin-top:6px}
.team-person{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:11px 0;border-bottom:1px solid var(--divider)}.team-person:last-child{border-bottom:0}.team-person strong{font-size:11.5px}.team-person .sub{font-size:9.5px;color:var(--text-muted);margin-top:3px}.team-person .score{font:700 13px var(--font-mono);text-align:right}.team-progress{height:6px;background:#E7EDE9;border-radius:999px;overflow:hidden;margin-top:7px}.team-progress i{display:block;height:100%;background:var(--primary);border-radius:inherit}

/* 7) QR attendance model. */
.attendance-qr-card{border:1px solid #BFD0C6;border-radius:16px;background:#fff;padding:15px;text-align:center}
.attendance-qr-title{font-size:13px;font-weight:700}.attendance-qr-sub{font-size:10px;line-height:1.5;color:var(--text-muted);margin-top:4px}
.attendance-qr{width:168px;height:168px;margin:14px auto 10px;padding:9px;border-radius:14px;border:1px solid var(--border);background:#fff;display:grid;place-items:center}.attendance-qr svg{width:148px;height:148px;shape-rendering:crispEdges}

  window.__leafLoaderMarkup=function(label){

  };
  try{__leafLoaderMarkup=window.__leafLoaderMarkup}catch(e){}

  // Robust local login transition so the v26.56 loader always uses the new markup.

    state.prototypeAuthenticated=true;
    const host=document.getElementById('app')||document.querySelector('.phone-screen'); if(!host)return;
    host.querySelector('.leaf-loading-overlay')?.remove();
    host.insertAdjacentHTML('beforeend',window.__leafLoaderMarkup('Đang tải dữ liệu nông trường'));
    const overlay=host.querySelector('.leaf-loading-overlay'); const fill=overlay?.querySelector('.leaf-fill'); const pct=overlay?.querySelector('.leaf-loading-percent');
    const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const duration=reduce?420:1150,start=performance.now();
    const step=now=>{const raw=Math.max(0,Math.min(1,(now-start)/duration)),e=1-Math.pow(1-raw,2.2),p=Math.round(e*100);if(fill){const h=51*e;fill.setAttribute('y',String(58-h));fill.setAttribute('height',String(h));}if(pct)pct.textContent=p+'%';if(raw<1)return requestAnimationFrame(step);setTimeout(()=>{navigationStack=[];state.screen=defaultScreenForRole[state.role]||'today';syncBrowserHistory('replace');render();},reduce?40:120)};
    requestAnimationFrame(step);
  };

  // Sticky assistant with safe local SVG and role-specific copy.
  window.agAiAssistantCard=function(){
    const cfg={
      worker:['Ghi nhật ký, hỏi việc hôm nay hoặc mở nhanh hồ sơ lô.','Tôi còn việc gì hôm nay?'],
      leader:['Điền lần cân, mở lệnh thu hoạch hoặc hỗ trợ chấm công tổ.','Cân CN045 tổng 31 ký 8, bì 1 ký 2, hạng A'],
      agronomist:['Ghi nhật ký, mở lô hoặc hỗ trợ rà soát dữ liệu.','Mở hồ sơ lô CH-07'],
      manager:['Tóm tắt điều hành và mở đúng nhóm cần xử lý.','Hôm nay có gì cần chú ý?'],
      buyer:['Điền nhanh số cân lại và ghi chú ngoại quan.','Cân lại hạng A 204 ký, hạng B 35 ký'],
      driver:['Tra cứu điểm tiếp theo, SLA và mở chỉ đường.','Điểm tiếp theo ở đâu?'],
      qc:['Điền nhanh chỉ tiêu QC; quyết định cổng vẫn do QC xác nhận.','Độ ẩm 12 phẩy 8, tạp chất 1 phẩy 4'],

    }[state.role]||['Hỗ trợ thao tác trong phạm vi quyền.','Tôi còn bản nào chưa gửi?'];
    return `<div class="ai-entry-card"><div class="ai-entry-row"><button class="ai-mic-orb" aria-label="Mở Trợ lý AgriOS" onclick="agAiOpenAssistant()">${MIC}</button><div class="grow"><div class="ai-entry-title">Trợ lý AgriOS</div><div class="ai-entry-copy">${cfg[0]}</div></div><button class="btn secondary small" onclick="agAiOpenAssistant()">Nói</button></div><div class="ai-entry-examples"><button class="ai-example-chip" onclick="agAiOpenAssistant(${JSON.stringify(cfg[1]).replace(/"/g,'&quot;')})">${esc17(cfg[1])}</button></div></div>`;
  };

  // Bottom navigation: one moving active region, all roles use the same effect.
  window.__agNavLastIndex=window.__agNavLastIndex??0;


  // Compact All Functions directory.
  const fn=(screen,ico,title)=>({screen,ico,title});
  const directory={
    worker:[fn('diaryCreate','diary','Ghi nhật ký'),fn('myTasks','clipboard','Việc hôm nay'),fn('attendance','check','QR chấm công'),fn('productivity','harvest','Năng suất'),fn('materials','box','Vật tư đang giữ'),fn('plotDetail','plot','Hồ sơ lô')],
    leader:[fn('weighing','harvest','Cân thu hoạch'),fn('harvestOrders','clipboard','Lệnh thu hoạch'),fn('attendanceScan','check','Chấm công tổ'),fn('diaryCreate','diary','Ghi nhật ký'),fn('myTasks','clipboard','Việc hôm nay'),fn('materials','box','Vật tư'),fn('productivity','harvest','Năng suất'),fn('plotDetail','plot','Hồ sơ lô')],
    agronomist:[fn('diaryApproval','check','Duyệt bước 1'),fn('diaryCreate','diary','Ghi nhật ký'),fn('myTasks','clipboard','Việc hôm nay'),fn('plotDetail','plot','Hồ sơ lô'),fn('materials','box','Vật tư'),fn('isolationBlock','bell','Cách ly')],
    manager:[fn('managerOps','home','Điều hành hôm nay'),fn('diaryApproval','check','Duyệt bước 2'),fn('myTasks','clipboard','Tiến độ tổ'),fn('attendance','check','Chấm công tổ'),fn('harvestList','harvest','Thu hoạch'),fn('teamProductivity','harvest','Năng suất tổ'),fn('plotDetail','plot','Hồ sơ lô'),fn('isolationBlock','bell','Cách ly')],
    buyer:[fn('collectionHome','harvest','Điểm gom'),fn('collectionReceive','check','Nhận lô thu hoạch'),fn('rawBatch','box','Lô nguyên liệu'),fn('plotDetail','plot','Hồ sơ lô')],
    driver:[fn('tripList','route','Chuyến của tôi'),fn('tripDetail','route','Chi tiết chuyến'),fn('notifications','bell','Thông báo'),fn('sync','sync','Hàng chờ')],
    qc:[fn('qcQueue','check','Lô chờ QC'),fn('qcForm','diary','Phiếu QC'),fn('notifications','bell','Thông báo'),fn('sync','sync','Hàng chờ')],
    warehouse:[fn('warehouseHome','box','Kho'),fn('whInbound','box','Nhập kho'),fn('whMove','route','Chuyển vị trí'),fn('whOutbound','harvest','Xuất kho'),fn('whCount','check','Kiểm kê'),fn('whLookup','plot','Tra cứu pallet')]
  };
  screens.allFunctions=function(){
    const items=directory[state.role]||[];
    return appShell(`<div class="v2617-directory-note">Các chức năng bạn được phép sử dụng trên thiết bị này.</div><div class="v2617-function-grid">${items.map(x=>`<button class="v2617-function-card" onclick="go('${x.screen}')"><span class="v2617-function-icon">${icon(x.ico)}</span><span class="v2617-function-title">${x.title}</span><span class="v2617-function-arrow">›</span></button>`).join('')}</div>`,{title:'Tất cả chức năng'});
  };

  // Productivity — richer but still data-first.
  const ring=(pct,label)=>`<div class="prod-ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="38"></circle><circle class="fill" cx="50" cy="50" r="38" pathLength="100" stroke-dasharray="${pct} 100"></circle></svg><div class="prod-ring-copy"><strong>${pct}%</strong><span>${label}</span></div></div>`;
  const week=()=>`<div class="week-bars">${[['T2',58],['T3',72],['T4',65],['T5',82],['T6',74],['T7',91],['CN',62]].map((x,i)=>`<div class="week-bar ${i===6?'active':''}"><i style="height:${x[1]}%"></i><span>${x[0]}</span></div>`).join('')}</div>`;



  // Deterministic QR visual for prototype attendance cards.
  function qrSvg(seed){
    const N=21, cells=[]; let h=2166136261; for(const c of seed){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}
    const finder=(ox,oy)=>{for(let y=0;y<7;y++)for(let x=0;x<7;x++){const edge=x===0||y===0||x===6||y===6, inner=x>=2&&x<=4&&y>=2&&y<=4;if(edge||inner)cells.push([ox+x,oy+y])}};
    finder(0,0);finder(14,0);finder(0,14);
    const reserved=(x,y)=>(x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12);
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(reserved(x,y))continue;h=Math.imul(h^((x+1)*31+(y+1)*17),1103515245)+12345;if(((h>>>3)&3)===0||((x*y+x+y)%11===0))cells.push([x,y])}
    return `<svg viewBox="0 0 21 21" role="img" aria-label="QR chấm công ${esc17(seed)}"><rect width="21" height="21" fill="#fff"/>${cells.map(([x,y])=>`<rect x="${x}" y="${y}" width="1" height="1" fill="#14231B"/>`).join('')}</svg>`;
  }
  const historyRows=(rows)=>`<div class="attendance-history"><div class="attendance-history-head">Lịch sử chấm công</div>${rows.map(r=>`<div class="attendance-history-row"><div class="day">${r[0]}</div><div class="times"><b>${r[1]}</b><br>${r[2]}</div><div class="state">${r[3]}</div></div>`).join('')}</div>`;
  state.v2617=state.v2617||{scanResult:null};
  window.v2617AttendanceRecord=function(kind){state.v2617.scanResult=kind;render()};


  if(screenMeta.attendance){screenMeta.attendance.label='Chấm công';screenMeta.attendance.purpose='Công nhân hiển thị QR cá nhân và lịch sử; Tổ trưởng quét QR để ghi vào/ra ca; Quản lý xem tổng quan.'}
  if(screenMeta.attendanceScan){screenMeta.attendanceScan.label='Quét QR chấm công';screenMeta.attendanceScan.purpose='Tổ trưởng quét QR công nhân trong tổ và ghi nhận vào/ra ca kèm lịch sử.'}

  // Ensure leader directory and home routes target the scan-first workflow.
  if(typeof render==='function')render();
})();
</script>

<script id="ag-v2617-queue-hotfix">
(function(){
  if(typeof state==='undefined' || typeof screens==='undefined') return;
  state.v2617Queue = state.v2617Queue || {
    retry: state.queueRetryState || 'error',
    packageRefreshed: false,
    packageTime: '06:42',
    lastNotice: ''
  };

  const queueState = () => state.v2617Queue;
  const statusIcon = (status) => status==='sent'?'✓':status==='error'?'!':status==='pending'?'↥':'↻';
  const statusLabel = (status) => status==='sent'?'Đã gửi':status==='error'?'Lỗi':status==='pending'?'Chờ gửi':'Đang gửi';
  const statusTone = (status) => status==='sent'?'ok':status==='error'?'danger':status==='pending'?'warn':'info';

  window.v2617QueueFilter=function(v){
    state.v2615 = state.v2615 || {};
    state.v2615.queueFilter=v;
    render();
  };

  window.v2617QueueRefreshPackage=function(){
    const q=queueState();
    const now=new Date();
    q.packageRefreshed=true;
    q.packageTime=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    q.lastNotice='Đã cập nhật gói dữ liệu offline trên thiết bị.';
    render();
  };

  window.v2617QueueRetry=function(){
    const q=queueState();
    if(state.offline){
      q.lastNotice='Thiết bị đang offline. Mục lỗi được giữ nguyên và sẽ gửi lại khi có mạng.';
      render();
      return;
    }
    if(q.retry==='sending') return;
    if(q.retry==='sent'){
      q.lastNotice='Mục lỗi đã được gửi lại thành công.';
      render();
      return;
    }
    q.retry='sending';
    state.queueRetryState='sending';
    q.lastNotice='Đang gửi lại Nhật ký CH-03…';
    render();
    clearTimeout(window.__agQueueRetryTimer);
    window.__agQueueRetryTimer=setTimeout(function(){
      q.retry='sent';
      state.queueRetryState='sent';
      q.lastNotice='Đã gửi lại Nhật ký CH-03 thành công.';
      if(state.screen==='sync') render();
    },1000);
  };

  window.v2617QueueEditError=function(){
    if(typeof window.agMockQueueEdit==='function'){
      window.agMockQueueEdit();
      return;
    }
    const q=queueState();
    q.lastNotice='Mục lỗi cần cập nhật Vụ trước khi gửi lại.';
    render();
  };

  // Keep the existing edit sheet, but make its submit update the current queue state too.
  if(typeof window.agMockQueueSubmit==='function'){
    const oldSubmit=window.agMockQueueSubmit;
    window.agMockQueueSubmit=function(){
      const q=queueState();
      q.retry='sending';
      state.queueRetryState='sending';
      q.lastNotice='Đang gửi lại Nhật ký CH-03…';
      if(typeof window.agMockCloseQueueEdit==='function') window.agMockCloseQueueEdit();
      render();
      clearTimeout(window.__agQueueRetryTimer);
      window.__agQueueRetryTimer=setTimeout(function(){
        q.retry='sent';
        state.queueRetryState='sent';
        q.lastNotice='Đã gửi lại Nhật ký CH-03 thành công.';
        if(state.screen==='sync') render();
      },1000);
    };
  }

  screens.sync=function(){
    const q=queueState();
    const f=(state.v2615&&state.v2615.queueFilter)||'all';
    const retryStatus=q.retry||'error';
    const items=[
      {title:'Nhật ký CH-07',type:'Nhật ký',status:'pending',meta:'Đã lưu trên máy · 15:40'},
      {title:'Ảnh bằng chứng · CH-07',type:'Ảnh',status:'sending',meta:'Đang tải ảnh sau nhật ký'},
      {title:'Lần cân TH-0310-07',type:'Cân',status:'sent',meta:'Đã gửi thành công'},
      {title:'Nhật ký CH-03',type:'Nhật ký',status:retryStatus,meta:retryStatus==='error'?'Vụ đã đóng · cần cập nhật trước khi gửi lại':retryStatus==='sending'?'Đang gửi lại dữ liệu':'Đã gửi lại thành công',error:true}
    ];
    const filtered=items.filter(it=>f==='all'||statusLabel(it.status)===f);
    const counts={pending:0,sending:0,sent:0,error:0};
    items.forEach(it=>{counts[it.status]=(counts[it.status]||0)+1;});
    const rows=filtered.map(it=>`<div class="list-item" ${it.error&&it.status==='error'?`onclick="v2617QueueEditError()" style="cursor:pointer"`:''}><div class="sync-icon">${statusIcon(it.status)}</div><div class="grow"><div class="card-title">${it.title}</div><div class="card-sub">${it.type} · ${it.meta}</div></div>${pill(statusLabel(it.status),statusTone(it.status))}${it.error&&it.status==='error'?'<span style="margin-left:6px">›</span>':''}</div>`).join('');
    const notice=q.lastNotice?`<div class="banner ${retryStatus==='sent'?'ok':state.offline?'warn':'info'}" style="margin-top:10px"><strong>${retryStatus==='sent'?'Hoàn tất':'Hàng chờ'}</strong>${q.lastNotice}</div>`:'';
    const retryLabel=retryStatus==='sending'?'Đang gửi lại…':retryStatus==='sent'?'Đã gửi lại':'Gửi lại mục lỗi';
    const retryDisabled=retryStatus==='sending'?'disabled':'';
    return appShell(`<div class="banner ${state.offline?'warn':'ok'}"><strong>${state.offline?'Đang offline':'Có kết nối'}</strong>Gói offline tải gần nhất lúc ${q.packageTime} · 05/10/2026.</div>${notice}<div class="queue-status"><div class="mini"><strong>${counts.pending}</strong><span>Chờ gửi</span></div><div class="mini"><strong>${counts.sending}</strong><span>Đang gửi</span></div><div class="mini"><strong>${counts.sent}</strong><span>Đã gửi</span></div><div class="mini"><strong>${counts.error}</strong><span>Lỗi</span></div></div><div class="v2615-chip-row">${['all','Chờ gửi','Đang gửi','Đã gửi','Lỗi'].map(x=>`<button class="v2615-chip ${f===x?'active':''}" onclick="v2617QueueFilter('${x}')">${x==='all'?'Tất cả':x}</button>`).join('')}</div><div class="list">${rows||'<div class="empty-state compact"><div class="card-title">Không có mục</div><div class="card-sub">Không có dữ liệu ở trạng thái này.</div></div>'}</div><div class="grid-2" style="margin-top:10px"><button class="btn secondary" onclick="v2617QueueRefreshPackage()">Tải lại gói offline</button><button class="btn primary" ${retryDisabled} onclick="v2617QueueRetry()">${retryLabel}</button></div>${retryStatus==='error'?`<button class="btn secondary block" style="margin-top:8px" onclick="v2617QueueEditError()">Sửa Nhật ký CH-03 trước khi gửi lại</button>`:''}` ,{title:'Hàng chờ',subtitle:'Dữ liệu trên thiết bị'});
  };
})();
</script>

<script id="ag-v2621-interaction-fixes-js">
(function(){
  const ALL21=['worker','leader','agronomist','manager','buyer','driver','qc','warehouse'];
  const WAVE21='<span class="ai-waveform" aria-hidden="true"><i class="ai-wave-bar"></i><i class="ai-wave-bar"></i><i class="ai-wave-bar"></i><i class="ai-wave-bar"></i><i class="ai-wave-bar"></i></span>';
  state.v2621=state.v2621||{aiPos:null,homeTask:null};

  // ---- 1) Draggable Assistive Touch -------------------------------------------------
  function fabMarkup21(){
    const p=state.v2621.aiPos;
    const pos=p?`left:${Math.round(p.x)}px;top:${Math.round(p.y)}px;right:auto;bottom:auto;`:'';
    return `<button class="ai-assistive-fab" style="${pos}" aria-label="Trợ lý AgriOS. Chạm để mở, kéo để di chuyển" title="Kéo để di chuyển · Chạm để mở" onpointerdown="agAiFabDragStart(event)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6"></path></svg></button>`;
  }
  const shellBefore21=appShell;
  appShell=function(content,opts={}){
    let html=shellBefore21(content,opts);
    // Replace the v26.20 static FAB, preserving the exact existing shell otherwise.
    html=html.replace(/<button class="ai-assistive-fab"[\s\S]*?<\/button>/,fabMarkup21());

  };

  let drag21=null;
  window.agAiFabDragStart=function(e){
    if(e.button!==undefined && e.button!==0) return;
    const btn=e.currentTarget;
    const root=btn.closest('.phone-screen')||btn.closest('.mobile-root');
    if(!root) return;
    const rr=root.getBoundingClientRect(), br=btn.getBoundingClientRect();
    drag21={btn,root,rr,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,x:br.left-rr.left,y:br.top-rr.top,moved:false};
    btn.classList.add('is-dragging');
    btn.setAttribute('aria-grabbed','true');
    try{btn.setPointerCapture(e.pointerId)}catch(_e){}
    e.preventDefault();
  };
  function dragMove21(e){
    if(!drag21||e.pointerId!==drag21.pointerId) return;
    const dx=e.clientX-drag21.startX,dy=e.clientY-drag21.startY;
    if(Math.hypot(dx,dy)>5) drag21.moved=true;
    const bw=drag21.btn.offsetWidth||54,bh=drag21.btn.offsetHeight||54;
    const maxX=Math.max(8,drag21.rr.width-bw-8);
    // Keep the floating control out of the bottom dock while still allowing the full content/header area.
    const maxY=Math.max(8,drag21.rr.height-bh-82);
    const x=Math.max(8,Math.min(maxX,drag21.x+dx));
    const y=Math.max(8,Math.min(maxY,drag21.y+dy));
    drag21.btn.style.left=x+'px';drag21.btn.style.top=y+'px';drag21.btn.style.right='auto';drag21.btn.style.bottom='auto';
    state.v2621.aiPos={x,y};
    e.preventDefault();
  }
  function dragEnd21(e,cancelled=false){
    if(!drag21||e.pointerId!==drag21.pointerId) return;
    const d=drag21;drag21=null;
    d.btn.classList.remove('is-dragging');d.btn.removeAttribute('aria-grabbed');
    try{d.btn.releasePointerCapture(e.pointerId)}catch(_e){}
    if(!cancelled&&!d.moved) window.agAiOpenAssistant&&window.agAiOpenAssistant();
    e.preventDefault();
  }
  window.addEventListener('pointermove',dragMove21,{passive:false});
  window.addEventListener('pointerup',e=>dragEnd21(e,false),{passive:false});
  window.addEventListener('pointercancel',e=>dragEnd21(e,true),{passive:false});

  // ---- 2) A card from "Việc hôm nay" opens one concrete item ------------------------
  if(typeof screenMeta!=='undefined'){
    screenMeta.todayTaskDetail={label:'Chi tiết công việc hôm nay',score:10,roles:ALL21,purpose:'Mở đúng công việc được chọn từ preview Việc hôm nay.',reason:'Không điều hướng nhầm về danh sách tổng.'};
  }
  ALL21.forEach(r=>{if(rolePermissions[r]&&!rolePermissions[r].includes('todayTaskDetail'))rolePermissions[r].push('todayTaskDetail');});

  function titleText21(card){return (card.querySelector('.v2616-task-title')?.textContent||'Công việc hôm nay').trim();}
  function metaText21(card){return (card.querySelector('.v2616-task-meta')?.textContent||'').trim();}
  function badgeText21(card){return (card.querySelector('.v2616-task-badge')?.textContent||'Hôm nay').trim();}
  function target21(card){const raw=card.getAttribute('onclick')||'';const m=raw.match(/go\('([^']+)'\)/);return m?m[1]:'today';}

  function workerId21(title){

  function describe21(task){

    if(state.role==='manager'&&/Duyệt nhật ký/.test(t))return 'Kiểm tra quản lý ở bước 2 sau khi nhật ký đã được Kỹ sư duyệt kỹ thuật.';
    if(state.role==='manager'&&/lệch cân/.test(t))return 'Đối soát lô thu hoạch đã đóng và nguyên nhân chênh lệch cân.';
    if(state.role==='buyer'&&/chờ nhận/.test(t))return 'Nhận đúng lô thu hoạch tại điểm gom, kiểm tra QR và cân lại trước khi xác nhận.';
    if(state.role==='buyer'&&/cân lại/.test(t))return 'Kiểm tra lần cân lại có cảnh báo chênh lệch trước khi tiếp tục nhận lô.';

    if(state.role==='driver'&&/Nhận NL/.test(t))return 'Quét và nhận đúng lô nguyên liệu tại điểm gom thuộc chuyến hiện tại.';
    if(state.role==='driver'&&/SLA/.test(t))return 'Theo dõi thời gian tươi còn lại của nguyên liệu trên chuyến.';
    if(state.role==='qc'&&/chờ QC/.test(t))return 'Mở đúng lô nguyên liệu để nhập chỉ tiêu QC đầu vào.';
    if(state.role==='qc'&&/HOLD/.test(t))return 'Kiểm tra lô đang HOLD và nguyên nhân/chỉ tiêu đang chờ xử lý.';
    if(state.role==='qc'&&/Phiếu QC mới/.test(t))return 'Tạo phiếu QC cho lô đang được chọn và nhập các chỉ tiêu bắt buộc.';
    if(state.role==='warehouse'&&/Nhập kho/.test(t))return 'Quét pallet và bin đích để hoàn tất giao dịch nhập kho.';
    if(state.role==='warehouse'&&/cần xuất/.test(t))return 'Tiếp tục phiếu xuất và quét pallet theo gợi ý FIFO/FEFO.';
    if(state.role==='warehouse'&&/Kiểm kê/.test(t))return 'Tiếp tục quét pallet trong bin và đối chiếu chênh lệch kiểm kê.';
    return 'Xem chi tiết công việc được chọn và tiếp tục vào đúng nghiệp vụ liên quan.';
  }
  function cta21(target,title){
    if(target==='diaryApproval')return state.role==='manager'?'Mở duyệt bước 2':'Mở duyệt bước 1';
    if(target==='weighing')return 'Tiếp tục cân';
    if(target==='harvestOrders')return 'Mở lệnh thu hoạch';
    if(target==='managerOps')return 'Mở điều hành';
    if(target==='collectionReceive')return 'Mở nhận lô';
    if(target==='rawBatch')return 'Mở lô nguyên liệu';
    if(target==='tripDetail')return 'Mở chi tiết chuyến';
    if(target==='qcForm')return 'Mở phiếu QC';
    if(target==='qcQueue')return 'Mở nghiệp vụ QC';
    if(target==='whInbound')return 'Mở nhập kho';
    if(target==='whOutbound')return 'Mở xuất kho';
    if(target==='whCount')return 'Mở kiểm kê';
    if(target==='plots'||target==='plotDetail')return 'Mở hồ sơ lô';
    if(target==='myTasks')return 'Mở kế hoạch liên quan';
    return 'Tiếp tục công việc';
  }
  window.agOpenTodayPreview=function(card){
    const title=titleText21(card),meta=metaText21(card),badge=badgeText21(card),target=target21(card);
    if(state.role==='worker'){
      const id=workerId21(title);
      if(id){state.selectedTaskId=id;state.planItemDiaryId=null;go('taskDetail');return;}
    }
    // QC preview should land on a concrete form/detail where one already exists.
    let next=target;
    if(state.role==='qc'&&/chờ QC|Phiếu QC mới/.test(title))next='qcForm';
    state.v2621.homeTask={title,meta,badge,target:next,description:describe21({title,meta})};

  };
  window.agContinueTodayPreview=function(){
    const t=state.v2621.homeTask;if(!t)return goRoot('today');
    go(t.target||'today');
  };
  screens.todayTaskDetail=function(){
    const t=state.v2621.homeTask||{title:'Công việc hôm nay',meta:'',badge:'Hôm nay',target:'today',description:'Chi tiết công việc.'};
    return appShell(`<div class="today-focus-card"><div class="today-focus-head"><div><div class="eyebrow">CÔNG VIỆC ĐƯỢC CHỌN</div><div class="today-focus-title" style="margin-top:4px">${t.title}</div><div class="today-focus-meta">${t.meta}</div></div>${pill(t.badge,t.badge==='Cảnh báo'||t.badge==='HOLD'||t.badge==='Lệch cân'?'warn':'info')}</div><div class="today-focus-context">${t.description}</div></div><div class="today-focus-list"><div class="today-focus-row"><span>Vai trò xử lý</span><strong>${roles[state.role].name}</strong></div><div class="today-focus-row"><span>Nguồn</span><strong>Việc hôm nay</strong></div><div class="today-focus-row"><span>Trạng thái</span><strong>${t.badge}</strong></div></div><div class="today-focus-actions"><button class="btn primary block" onclick="agContinueTodayPreview()">${cta21(t.target,t.title)}</button><button class="btn secondary block" onclick="goBack()">Quay lại</button></div>`,{title:'Chi tiết công việc'});
  };

  // Capture only preview cards. "Mở tất cả công việc" keeps its original behavior.
  document.addEventListener('click',function(e){
    const card=e.target.closest&&e.target.closest('.v2616-task-card');
    if(!card)return;
    e.preventDefault();e.stopImmediatePropagation();
    window.agOpenTodayPreview(card);
  },true);

  // ---- 3) Animated voice-level indicator -------------------------------------------
  function enhanceVoice21(){
    const listen=document.getElementById('agAiListen');
    const head=document.querySelector('.ai-assistant-sheet .ai-sheet-head .ai-mic-orb');
    [listen,head].forEach(btn=>{if(btn&&!btn.querySelector('.ai-waveform'))btn.insertAdjacentHTML('beforeend',WAVE21);});

      const mo=new MutationObserver(mirror);mo.observe(listen,{attributes:true,attributeFilter:['class']});mirror();
      listen.__agVoiceMirror=mo;
    }
  }
  // Native AI screen owns opening.
  const openBefore21=null;
  
})();

<script id="ag-v2622-ai-anchor-panel-js">
(function(){
  state.v2622=state.v2622||{
    anchor:null,
    recognition:null,
    simTimer:null,
    listenStartedAt:0,
    panelClosing:false
  };

  const MIN_LISTEN_MS=1800;
  const SIMULATED_LISTEN_MS=2800;

  function aiRoot22(){
    return document.querySelector('.phone-screen') || document.querySelector('.mobile-root');
  }
  function currentFab22(){
    return aiRoot22()?.querySelector('.ai-assistive-fab') || document.querySelector('.ai-assistive-fab');
  }
  function clamp22(v,min,max){ return Math.max(min,Math.min(max,v)); }

  function captureAnchor22(){
    const root=aiRoot22(), fab=currentFab22();
    if(!root) return null;
    const rr=root.getBoundingClientRect();
    if(fab){
      const fr=fab.getBoundingClientRect();
      return {
        root,
        rr,
        left:fr.left-rr.left,
        top:fr.top-rr.top,
        right:fr.right-rr.left,
        bottom:fr.bottom-rr.top,
        cx:(fr.left+fr.right)/2-rr.left,
        cy:(fr.top+fr.bottom)/2-rr.top
      };
    }
    return {
      root,rr,
      left:rr.width-72,top:rr.height-150,right:rr.width-18,bottom:rr.height-96,
      cx:rr.width-45,cy:rr.height-123
    };
  }

  function positionAssistant22(anchor){
    const root=anchor?.root||aiRoot22();
    if(!root) return;
    const layer=root.querySelector('.ai-assistant-layer');
    const sheet=layer?.querySelector('.ai-assistant-sheet');
    if(!layer||!sheet) return;

    const rr=root.getBoundingClientRect();
    const nav=root.querySelector('.bottom-nav');
    const navRect=nav?.getBoundingClientRect();
    const topBound=12;
    const bottomBound=navRect ? Math.max(topBound+220,navRect.top-rr.top-8) : rr.height-12;
    const totalHeight=Math.max(220,bottomBound-topBound);

    const width=Math.min(334,rr.width-24);
    sheet.style.width=width+'px';
    sheet.style.maxWidth='none';
    sheet.style.height='auto';
    sheet.style.maxHeight='none';
    sheet.style.visibility='hidden';
    sheet.style.left='12px';
    sheet.style.top=topBound+'px';

    const naturalH=Math.min(sheet.scrollHeight,totalHeight);
    const gap=10;
    const a=anchor||{
      left:rr.width-72,top:rr.height-150,right:rr.width-18,bottom:rr.height-96,
      cx:rr.width-45,cy:rr.height-123
    };
    const below=Math.max(0,bottomBound-a.bottom-gap);
    const above=Math.max(0,a.top-topBound-gap);

    let panelH=naturalH;
    let top;
    if(below>=Math.min(naturalH,300) || below>=above){
      panelH=Math.min(naturalH,Math.max(210,below));
      top=clamp22(a.bottom+gap,topBound,bottomBound-panelH);
    }else{
      panelH=Math.min(naturalH,Math.max(210,above));
      top=clamp22(a.top-gap-panelH,topBound,bottomBound-panelH);
    }

    // If neither side is large enough, center around the anchor and let the panel scroll.
    if(panelH>totalHeight || (below<210 && above<210)){
      panelH=totalHeight;
      top=topBound;
    }

    let left;
    if(a.cx<=rr.width/2){
      left=clamp22(a.left-8,12,rr.width-width-12);
    }else{
      left=clamp22(a.right-width+8,12,rr.width-width-12);
    }

    sheet.style.left=Math.round(left)+'px';
    sheet.style.top=Math.round(top)+'px';
    sheet.style.bottom='auto';
    sheet.style.right='auto';
    sheet.style.maxHeight=Math.round(panelH)+'px';
    sheet.style.visibility='visible';

    sheet.style.setProperty('--ai-origin-x',Math.round(ox)+'px');
    sheet.style.setProperty('--ai-origin-y',Math.round(oy)+'px');
    state.v2622.anchor={...a,leftPanel:left,topPanel:top};

    sheet.classList.remove('ag-anchor-closing');
    void sheet.offsetWidth;
    sheet.classList.add('ag-anchor-opening');

    root.classList.add('ag-ai-panel-open');
    layer.classList.remove('ag-anchor-closing');
  }

  const openBefore22=window.agAiOpenAssistant;
  

  const closeBefore22=window.agAiCloseAssistant;
  

  // Keep the panel in a sensible place after a resize/orientation change.
  window.addEventListener('resize',()=>{
    const root=aiRoot22();
    if(root?.querySelector('.ai-assistant-layer')){
      const fresh=captureAnchor22()||state.v2622.anchor;
      requestAnimationFrame(()=>positionAssistant22(fresh));
    }
  });

  function voiceButtons22(){
    const listen=document.getElementById('agAiListen');
    const head=document.querySelector('.ai-assistant-sheet .ai-sheet-head .ai-mic-orb');
    return {listen,head};
  }
  function setListening22(on){
    const {listen,head}=voiceButtons22();
    listen?.classList.toggle('listening',on);
    head?.classList.toggle('listening',on);
  }
  function elapsed22(){ return performance.now()-(state.v2622.listenStartedAt||performance.now()); }
  function afterMinimum22(fn){
    const wait=Math.max(0,MIN_LISTEN_MS-elapsed22());
    setTimeout(fn,wait);
  }

  window.agAiStartListening=function(){
    const input=document.getElementById('agAiCommand');
    const status=document.getElementById('agAiStatus');
    if(!input) return;

    // A second tap acts as "stop listening" when native recognition is active.
    if(state.v2622.recognition){
      try{ state.v2622.recognition.stop(); }catch(_e){}
      if(status) status.textContent='Đang kết thúc ghi giọng nói…';
      return;
    }

    if(state.v2622.simTimer){
      clearTimeout(state.v2622.simTimer);
      state.v2622.simTimer=null;
    }

    state.v2622.listenStartedAt=performance.now();
    setListening22(true);
    if(status) status.textContent='Đang nghe…';

    const fallback=state.role==='leader'
      ?'Cân CN045 tổng 31 ký 8, bì 1 ký 2, hạng A'
      :(['worker','agronomist'].includes(state.role)
        ?'Ghi nhật ký chăm sóc lô CH-07 từ 8 giờ 10 đến 9 giờ 20, tình hình vẫn ổn'
        :'Tôi còn bản nào chưa gửi?');

    const simulate=()=>{
      state.v2622.simTimer=setTimeout(()=>{
        state.v2622.simTimer=null;
        input.value=fallback;
        setListening22(false);
        if(status) status.textContent='Đã ghi nhận giọng nói.';
        window.agAiAnalyze&&window.agAiAnalyze();
      },SIMULATED_LISTEN_MS);
    };

    const SR=null;
    if(!SR){ simulate(); return; }

    try{
      const r=new SR();
      state.v2622.recognition=r;
      r.lang='vi-VN';
      r.interimResults=true;
      r.maxAlternatives=1;
      r.continuous=false;

      let transcript='';
      let hadResult=false;
      let failed=false;

      r.onresult=e=>{
        let combined='';
        for(let i=0;i<e.results.length;i++){
          combined+=(e.results[i][0]?.transcript||'')+' ';
        }
        transcript=combined.trim();
        if(transcript){
          hadResult=true;
          input.value=transcript;
          if(status) status.textContent='Đang nghe…';
        }
      };
      r.onerror=e=>{
        failed=true;
        state.v2622.recognition=null;
        afterMinimum22(()=>{
          setListening22(false);
          if(status) status.textContent='Không thể tiếp tục dùng mic. Bạn vẫn có thể nhập yêu cầu.';
        });
      };
      r.onend=()=>{
        state.v2622.recognition=null;
        if(failed) return;
        afterMinimum22(()=>{
          setListening22(false);
          if(hadResult&&transcript){
            input.value=transcript;
            if(status) status.textContent='Đã ghi nhận giọng nói.';
            window.agAiAnalyze&&window.agAiAnalyze();
          }else{
            if(status) status.textContent='Chưa nghe rõ. Nhấn mic để thử lại.';
          }
        });
      };
      r.start();
    }catch(_e){
      state.v2622.recognition=null;
      simulate();
    }

<script id="ag-v2623-ai-home-detail-polish-js">
(function(){

  function root23(){
    return document.querySelector('.phone-screen')||document.querySelector('.mobile-root');
  }

  function decorateAi23(){
    const sheet=document.querySelector('.ai-assistant-sheet');
    if(!sheet)return;

    // Header mic is visual branding only. The mic beside the textarea is the only voice control.
    const headMic=sheet.querySelector('.ai-sheet-head .ai-mic-orb');
    if(headMic){
      headMic.removeAttribute('onclick');
      headMic.removeAttribute('aria-label');
      headMic.setAttribute('aria-hidden','true');
      headMic.setAttribute('tabindex','-1');
      headMic.style.pointerEvents='none';
      headMic.style.cursor='default';
      headMic.classList.remove('listening');
    }

    const listen=document.getElementById('agAiListen');
    if(listen){
      listen.setAttribute('aria-label','Bắt đầu hoặc dừng ghi giọng nói');
      // v26.21 mirrored the listening class to the decorative mic. Stop that mirror.
      if(listen.__agVoiceMirror && typeof listen.__agVoiceMirror.disconnect==='function'){
        listen.__agVoiceMirror.disconnect();
        listen.__agVoiceMirror=null;
      }
    }
  }

  function assistantBounds23(){
    const root=root23();
    if(!root)return null;
    const rr=root.getBoundingClientRect();
    const nav=root.querySelector('.bottom-nav');
    const nr=nav?.getBoundingClientRect();
    return {
      root,rr,
      top:12,
      bottom:nr?Math.max(232,nr.top-rr.top-8):rr.height-12
    };
  }

  function fitAssistant23(preferDown=true){
    const sheet=document.querySelector('.ai-assistant-sheet');
    const b=assistantBounds23();
    if(!sheet||!b)return;

    const total=Math.max(220,b.bottom-b.top);
    let top=parseFloat(sheet.style.top);
    if(!Number.isFinite(top)) top=b.top;

    sheet.classList.remove('ai-scrollable');
    sheet.style.maxHeight='none';
    sheet.style.overflowY='hidden';

    // scrollHeight remains the full content size even if the previous state was clipped.
    const natural=Math.max(200,sheet.scrollHeight);
    const availableBelow=Math.max(0,b.bottom-top);

    if(natural<=availableBelow){
      // Preferred behavior: grow down from the current anchor position.
      sheet.style.maxHeight=Math.ceil(natural)+'px';
      return;
    }

    if(natural<=total){
      // Not enough room below: move upward only as much as needed, still without a scrollbar.
      const newTop=Math.max(b.top,b.bottom-natural);
      sheet.style.top=Math.round(newTop)+'px';
      sheet.style.maxHeight=Math.ceil(natural)+'px';
      return;
    }

    // Content is genuinely taller than the usable viewport: only now enable scrolling.
    sheet.style.top=Math.round(b.top)+'px';
    sheet.style.maxHeight=Math.floor(total)+'px';
    sheet.classList.add('ai-scrollable');
    sheet.style.overflowY='auto';
  }

  // Keep v26.22's anchor-opening animation, then refine behavior/semantics.
  const openBefore23=window.agAiOpenAssistant;
  

  // When analysis adds result content, expand the frame downward first.
  const analyzeBefore23=window.agAiAnalyze;
  window.agAiAnalyze=function(){
    const out=analyzeBefore23?analyzeBefore23.apply(this,arguments):undefined;
    requestAnimationFrame(()=>fitAssistant23(true));
    setTimeout(()=>fitAssistant23(true),40);
    setTimeout(()=>fitAssistant23(true),140);
    return out;
  };

  window.addEventListener('resize',()=>{
    
  });

  // Put Quick Actions before Today work on Home, while preserving all existing actions and flows.
  const todayBefore23=screens.today;
  screens.today=function(){
    const html=todayBefore23();
    try{
      const doc=new DOMParser().parseFromString(html,'text/html');
      const home=doc.querySelector('.v2616-home');
      if(!home)return html;

      const heads=[...home.querySelectorAll('.v2616-section-head')];
      const quickHead=heads.find(h=>(h.querySelector('.v2616-section-title')?.textContent||'').trim()==='Thao tác nhanh');
      const todayHead=heads.find(h=>(h.querySelector('.v2616-section-title')?.textContent||'').trim()==='Việc hôm nay');
      const quickGrid=quickHead?.nextElementSibling;

      if(quickHead&&todayHead&&quickGrid?.classList.contains('v2616-quick-grid')){
        home.insertBefore(quickHead,todayHead);
        home.insertBefore(quickGrid,todayHead);
      }
      return doc.body.innerHTML;
    }catch(_e){
      return html;
    }
  };

  if(typeof render==='function')render();
})();
</script>

    items.forEach(it=>counts[it.status]=(counts[it.status]||0)+1);

    const rows=filtered.map(it=>`
      <div class="list-item" ${it.error&&it.status==='error'?`onclick="v2617QueueEditError()" style="cursor:pointer"`:''}>
        <div class="sync-icon ag-queue-status-icon ${it.status}" aria-label="${queueLabel24(it.status)}">${queueIcon24(it.status)}</div>
        <div class="grow">
          <div class="card-title">${it.title}</div>
          <div class="card-sub">${it.type} · ${it.meta}</div>
        </div>
        ${pill(queueLabel24(it.status),queueTone24(it.status))}
        ${it.error&&it.status==='error'?'<span style="margin-left:6px">›</span>':''}
      </div>`).join('');

    const notice=q.lastNotice?`<div class="banner ${retryStatus==='sent'?'ok':state.offline?'warn':'info'}" style="margin-top:10px"><strong>${retryStatus==='sent'?'Hoàn tất':'Hàng chờ'}</strong>${q.lastNotice}</div>`:'';
    const retryLabel=retryStatus==='sending'?'Đang gửi lại…':retryStatus==='sent'?'Đã gửi lại':'Gửi lại mục lỗi';
    const retryDisabled=retryStatus==='sending'?'disabled':'';

    return appShell(`
      <div class="banner ${state.offline?'warn':'ok'}"><strong>${state.offline?'Đang offline':'Có kết nối'}</strong>Gói offline tải gần nhất lúc ${q.packageTime} · 05/10/2026.</div>
      ${notice}
      <div class="queue-status">
        <div class="mini"><strong>${counts.pending}</strong><span>Chờ gửi</span></div>
        <div class="mini"><strong>${counts.sending}</strong><span>Đang gửi</span></div>
        <div class="mini"><strong>${counts.sent}</strong><span>Đã gửi</span></div>
        <div class="mini"><strong>${counts.error}</strong><span>Lỗi</span></div>
      </div>
      <div class="v2615-chip-row">${['all','Chờ gửi','Đang gửi','Đã gửi','Lỗi'].map(x=>`<button class="v2615-chip ${f===x?'active':''}" onclick="v2617QueueFilter('${x}')">${x==='all'?'Tất cả':x}</button>`).join('')}</div>
      <div class="list">${rows||'<div class="empty-state compact"><div class="card-title">Không có mục</div><div class="card-sub">Không có dữ liệu ở trạng thái này.</div></div>'}</div>
      <div class="grid-2" style="margin-top:10px">
        <button class="btn secondary" onclick="v2617QueueRefreshPackage()">Tải lại gói offline</button>
        <button class="btn primary" ${retryDisabled} onclick="v2617QueueRetry()">${retryLabel}</button>
      </div>
      ${retryStatus==='error'?`<button class="btn secondary block" style="margin-top:8px" onclick="v2617QueueEditError()">Sửa Nhật ký CH-03 trước khi gửi lại</button>`:''}
    `,{title:'Hàng chờ',subtitle:'Dữ liệu trên thiết bị'});
  };

  // Strict guard: no route/overlay may bypass the queue rule.
  const confirmLogoutBase24=window.confirmLogout;
  window.confirmLogout=function(){
    if(hasUnsynced24()){
      state.logoutSheetOpen=false;
      if(state.screen!=='logoutConfirm') go('logoutConfirm');
      else render();
      return;
    }
    return confirmLogoutBase24?confirmLogoutBase24():undefined;
  };
  confirmLogout=window.confirmLogout;

  window.openLogoutSheet=function(){
    state.logoutSheetOpen=false;
    if(hasUnsynced24()){
      if(state.screen!=='logoutConfirm') go('logoutConfirm');
      else render();
      return;
    }
    if(state.screen!=='logoutConfirm') go('logoutConfirm');
  };

  screens.logoutConfirm=function(){
    const c=queueCounts24();
    const total=c.pending+c.sending+c.error;
    if(total>0){
      return appShell(`
        <div class="v2615-alert danger">
          <strong>Chưa thể đăng xuất</strong>
          <span>Thiết bị còn ${total} mục chưa hoàn tất đồng bộ. Hãy xử lý Hàng chờ trước khi kết thúc phiên.</span>
        </div>
        <div class="v2615-grid" style="margin-top:12px">
          <div class="v2615-stat"><b>${c.pending}</b><span>Chờ gửi</span></div>
          <div class="v2615-stat"><b>${c.sending}</b><span>Đang gửi</span></div>
          <div class="v2615-stat"><b>${c.error}</b><span>Lỗi</span></div>
          <div class="v2615-stat"><b>${c.sent}</b><span>Đã gửi</span></div>
        </div>
        <button class="btn primary block" style="margin-top:12px" onclick="goRoot('sync')">Mở Hàng chờ</button>
        <button class="btn secondary block" style="margin-top:8px" onclick="goBack()">Tiếp tục làm việc</button>
      `,{title:'Đăng xuất'});
    }
    return appShell(`
      <div class="flow-success">
        <div class="success-icon">${icon('check')}</div>
        <div class="flow-success-title">Dữ liệu đã đồng bộ</div>
        <div class="card-sub">Không còn mục nào chờ gửi trên thiết bị.</div>
      </div>
      <button class="btn danger block" style="margin-top:12px" onclick="confirmLogout()">Đăng xuất</button>
      <button class="btn secondary block" style="margin-top:8px" onclick="goBack()">Hủy</button>
    `,{title:'Đăng xuất'});
  };
})();
</script>

<script id="ag-v2628-ai-motion-polish-js">
(function(){
  function root28(){
    return document.querySelector('.phone-screen') || document.querySelector('.mobile-root');
  }

  function syncCloseOrigin28(){
    const root=root28();
    const sheet=root?.querySelector('.ai-assistant-sheet');
    const fab=root?.querySelector('.ai-assistive-fab') || document.querySelector('.ai-assistive-fab');
    if(!root||!sheet||!fab)return;

    // visibility:hidden on the FAB does not remove its box, so this remains accurate while AI is open.
    const sr=sheet.getBoundingClientRect();
    const fr=fab.getBoundingClientRect();
    const ox=(fr.left+fr.width/2)-sr.left;
    const oy=(fr.top+fr.height/2)-sr.top;

    sheet.style.setProperty('--ai-origin-x',Math.round(ox)+'px');
    sheet.style.setProperty('--ai-origin-y',Math.round(oy)+'px');
    sheet.style.transformOrigin=Math.round(ox)+'px '+Math.round(oy)+'px';
  }

  const closeBefore28=window.agAiCloseAssistant;
  
})();
</script>

        ${supportsTablet31()?`<button type="button" data-device="tablet" onclick="agSetDevice30('tablet')">Tablet</button>`:''}
      `;
      document.body.appendChild(panel);
    }
    sync31();
  }

  const setDeviceBefore31=window.agSetDevice30;
  window.agSetDevice30=function(device){
    const out=setDeviceBefore31 ? setDeviceBefore31(device) : undefined;
    requestAnimationFrame(sync31);
    return out;
  };

  const renderBefore31=window.render;
  window.render=function(){
    const out=renderBefore31.apply(this,arguments);
    requestAnimationFrame(()=>{
      install31();
      sync31();
    });
    return out;
  };

  install31();
  sync31();
})();
</script>

<script id="ag-v2635-queue-logout-fix-js">
(function(){
  function ensureState(){
    if(!window.state) window.state={};
    if(!state.v2615) state.v2615={};
    return state;
  }
  function ensureQueue(){
    const s=ensureState();
    if(!Array.isArray(s.v2635QueueItems)){
      s.v2635QueueItems=[
        {id:'q1',title:'Nhật ký CH-07',kind:'Nhật ký',status:'Chờ gửi',time:'05/10/2026 15:40'},
        {id:'q2',title:'Ảnh bằng chứng · CH-07',kind:'Ảnh',status:'Đang gửi',time:'05/10/2026 15:41'},
        {id:'q3',title:'Lần cân TH-0310-07',kind:'Cân',status:'Đã gửi',time:'05/10/2026 15:35'},
        {id:'q4',title:'Biên bản kiểm tra CH-03',kind:'Biểu mẫu',status:'Đã gửi',time:'05/10/2026 14:58'}
      ];
    }
    return s.v2635QueueItems;
  }
  function summarizeQueue(){
    const counts={pending:0,sending:0,error:0,sent:0,blocking:0};
    ensureQueue().forEach(item=>{
      if(item.status==='Chờ gửi'){counts.pending++;counts.blocking++;}
      else if(item.status==='Đang gửi'){counts.sending++;counts.blocking++;}
      else if(item.status==='Lỗi'){counts.error++;counts.blocking++;}
      else {counts.sent++;}
    });
    return counts;
  }
  function toneFor(status){
    return status==='Đã gửi' ? 'ok' : status==='Đang gửi' ? 'info' : status==='Lỗi' ? 'danger' : 'warn';
  }
  function iconFor(status){
    return status==='Đã gửi' ? '✓' : status==='Đang gửi' ? '↻' : status==='Lỗi' ? '!' : '↥';
  }
  window.agQueueSendAll=function(){
    const s=ensureState();
    ensureQueue().forEach(item=>{ if(item.status!=='Đã gửi') item.status='Đã gửi'; });
    s.offline=false;
    if(s.v2615) s.v2615.queueFilter='all';
    render();
  };
  window.agQueueResetDemo=function(){
    const s=ensureState();
    delete s.v2635QueueItems;
    render();
  };
  screens.sync=function(){
    const s=ensureState();
    const filter=s.v2615.queueFilter||'all';
    const items=ensureQueue();
    const counts=summarizeQueue();
    const chips=['all','Chờ gửi','Đang gửi','Đã gửi','Lỗi'].map(x=>`<button class="v2615-chip ${filter===x?'active':''}" onclick="state.v2615.queueFilter='${x}';render()">${x==='all'?'Tất cả':x}</button>`).join('');
    const visible=items.filter(item=>filter==='all'||item.status===filter);
    const rows=visible.map(item=>`<div class="list-item"><div class="sync-icon">${iconFor(item.status)}</div><div class="grow"><div class="card-title">${item.title}</div><div class="card-sub">${item.kind} · ${item.time}</div></div>${pill(item.status,toneFor(item.status))}</div>`).join('');
    const summary=`<div class="v2615-grid" style="margin-top:12px"><div class="v2615-stat"><b>${counts.pending}</b><span>Chờ gửi</span></div><div class="v2615-stat"><b>${counts.sending}</b><span>Đang gửi</span></div><div class="v2615-stat"><b>${counts.error}</b><span>Lỗi</span></div><div class="v2615-stat"><b>${counts.sent}</b><span>Đã gửi</span></div></div>`;
    const empty=`<div class="empty-state compact"><div class="big">✓</div><div class="card-title">Không còn dữ liệu chờ đồng bộ</div><div class="card-sub" style="margin-top:6px">Tất cả bản ghi hiện đã được gửi thành công.</div></div>`;
    const banner = counts.blocking>0
      ? `<div class="banner ${s.offline?'warn':'info'}"><strong>${s.offline?'Đang offline':'Còn dữ liệu cần xử lý'}</strong>${s.offline?'Dữ liệu mới sẽ tiếp tục nằm trong hàng chờ cho đến khi có mạng.':'Hoàn tất gửi tất cả để có thể đăng xuất an toàn.'}</div>`
      : `<div class="banner ok"><strong>Đồng bộ hoàn tất</strong>Thiết bị hiện không còn mục Chờ gửi, Đang gửi hay Lỗi.</div>`;
    const actions = counts.blocking>0
      ? `<div class="grid-2" style="margin-top:10px"><button class="btn secondary" onclick="state.offline=false;render()">Kiểm tra lại</button><button class="btn primary" onclick="agQueueSendAll()">Gửi tất cả</button></div>`
      : `<div class="grid-2" style="margin-top:10px"><button class="btn secondary" onclick="agQueueResetDemo()">Khôi phục mẫu</button><button class="btn primary" onclick="go('logoutConfirm')">Thử đăng xuất</button></div>`;
    return appShell(`${banner}${summary}<div class="v2615-chip-row">${chips}</div><div class="list">${rows||empty}</div>${actions}`,{title:'Hàng chờ',subtitle:'Không tự xóa dữ liệu'});
  };
  screens.logoutConfirm=function(){
    const counts=summarizeQueue();
    if(counts.blocking>0){
      return appShell(`<div class="v2615-alert danger"><strong>Chưa thể đăng xuất</strong><span>Thiết bị còn ${counts.pending} mục Chờ gửi, ${counts.sending} mục Đang gửi và ${counts.error} mục Lỗi. Hãy xử lý dữ liệu trước khi kết thúc phiên.</span></div><div class="v2615-grid" style="margin-top:12px"><div class="v2615-stat"><b>${counts.pending}</b><span>Chờ gửi</span></div><div class="v2615-stat"><b>${counts.sending}</b><span>Đang gửi</span></div><div class="v2615-stat"><b>${counts.error}</b><span>Lỗi</span></div><div class="v2615-stat"><b>${counts.sent}</b><span>Đã gửi</span></div></div><button class="btn primary block" style="margin-top:12px" onclick="goRoot('sync')">Mở Hàng chờ</button><button class="btn secondary block" style="margin-top:8px" onclick="goBack()">Tiếp tục làm việc</button>`,{title:'Đăng xuất'});
    }
    return appShell(`<div class="banner ok"><strong>Có thể đăng xuất</strong>Thiết bị hiện không còn mục nào cần chờ đồng bộ.</div><div class="card" style="margin-top:12px"><div class="card-title">Đăng xuất khỏi AgriOS?</div><div class="card-sub">Các bản ghi đã gửi sẽ được giữ nguyên trên hệ thống. Bạn có thể đăng nhập lại bất cứ lúc nào để tiếp tục làm việc.</div></div><button class="btn danger block" style="margin-top:12px" onclick="confirmLogout()">Đăng xuất</button><button class="btn secondary block" style="margin-top:8px" onclick="goBack()">Hủy</button>`,{title:'Đăng xuất'});
  };
})();
</script>

<script id="ag-v2638-appearance-button-queue-polish-js">
(function(){
  state.v2638=state.v2638||{};
  function stored38(key,fallback){try{const v=localStorage.getItem(key);return v===null?fallback:v}catch(e){return fallback}}
  if(!state.v2638.theme) state.v2638.theme=stored38('agrios-theme.agronomist','light');
  if(typeof state.v2638.glass!=='boolean') state.v2638.glass=stored38('agrios-glass.agronomist','off')!=='off';

  function save38(){
    try{localStorage.setItem('agrios-theme.agronomist',state.v2638.theme);localStorage.setItem('agrios-glass.agronomist',state.v2638.glass?'on':'off')}catch(e){}
  }
  function apply38(){
    const root=document.querySelector('.phone-screen');
    if(root){
      root.classList.toggle('ag-dark-theme',state.v2638.theme==='dark');
      root.classList.toggle('ag-glass-off',!state.v2638.glass);
    }
    document.querySelectorAll('.ag-appearance-floating [data-theme]').forEach(b=>b.classList.toggle('active',b.dataset.theme===state.v2638.theme));
    document.querySelectorAll('.ag-appearance-floating [data-glass]').forEach(b=>b.classList.toggle('active',(b.dataset.glass==='on')===state.v2638.glass));
  }
  window.agSetTheme38=function(theme){state.v2638.theme=theme==='dark'?'dark':'light';save38();apply38();render()};
  window.agSetGlass38=function(on){state.v2638.glass=!!on;save38();apply38();render()};

  function installAppearance38(){
    let panel=document.querySelector('.ag-appearance-floating');
    if(!panel){
      panel=document.createElement('div');panel.className='ag-appearance-floating';panel.setAttribute('aria-label','Tùy chọn giao diện prototype');
      panel.innerHTML=`<div class="ag-appearance-row"><span class="ag-appearance-label">Theme</span><button data-theme="light" onclick="agSetTheme38('light')">Light</button><button data-theme="dark" onclick="agSetTheme38('dark')">Dark</button></div>`;
      document.body.appendChild(panel);
    }
    apply38();
  }

  function enhanceQueue38(){
    if(state.screen!=='sync')return;
    document.querySelectorAll('.phone-screen .list-item .sync-icon').forEach(el=>{
      const row=el.closest('.list-item');if(!row)return;
      const text=row.textContent||'';
      el.classList.remove('pending','sending','sent','error');
      el.classList.add('ag-queue-status-icon');
      if(text.includes('Đã gửi')){el.classList.add('sent');el.textContent='✓';el.setAttribute('aria-label','Đã gửi');el.title='Đã gửi'}
      else if(text.includes('Đang gửi')){el.classList.add('sending');el.textContent='↻';el.setAttribute('aria-label','Đang gửi');el.title='Đang gửi'}
      else if(text.includes('Lỗi')){el.classList.add('error');el.textContent='!';el.setAttribute('aria-label','Lỗi');el.title='Lỗi'}
      else{el.classList.add('pending');el.textContent='↥';el.setAttribute('aria-label','Chờ gửi');el.title='Chờ gửi'}
    });
  }

  function fitButtons38(root){
    if(!root)return;
    const candidates=root.querySelectorAll('button.btn,button.inline-action,button.tenant-change,button.v2616-tenant-change,button.ag-scan-manual');
    candidates.forEach(btn=>{
      if(btn.closest('.bottom-nav'))return;
      btn.classList.remove('ag-btn-fit-1','ag-btn-fit-2','ag-btn-span');
      btn.style.removeProperty('font-size');
      if(btn.scrollWidth<=btn.clientWidth+1)return;
      btn.classList.add('ag-btn-fit-1');
      if(btn.scrollWidth<=btn.clientWidth+1)return;
      btn.classList.add('ag-btn-fit-2');
      if(btn.scrollWidth<=btn.clientWidth+1)return;
      const parent=btn.parentElement;
      if(parent&&parent.classList.contains('grid-2')){
        btn.classList.add('ag-btn-span');
        btn.classList.remove('ag-btn-fit-2');
        if(btn.scrollWidth>btn.clientWidth+1)btn.classList.add('ag-btn-fit-1');
      }
    });
  }

  const accountBefore38=screens.account;
  if(accountBefore38){
    screens.account=function(){
      const base=accountBefore38.apply(this,arguments);
      const theme=state.v2638.theme;
      const card=`<div class="ag-appearance-card"><div class="eyebrow">GIAO DIỆN</div><div class="ag-appearance-setting"><div><strong>Chế độ hiển thị</strong><span>Áp dụng cho toàn bộ giao diện AgriOS.</span></div><div class="ag-choice-pair"><button class="${theme==='light'?'active':''}" onclick="agSetTheme38('light')">Sáng</button><button class="${theme==='dark'?'active':''}" onclick="agSetTheme38('dark')">Tối</button></div></div></div>`;
      return base.replace('</main>',card+'</main>');
    };
  }

  const renderBefore38=window.render;
  window.render=function(){
    const out=renderBefore38.apply(this,arguments);
    requestAnimationFrame(()=>{
      installAppearance38();
      apply38();
      enhanceQueue38();
      fitButtons38(document.querySelector('.phone-screen'));
      requestAnimationFrame(()=>fitButtons38(document.querySelector('.phone-screen')));
    });
    return out;
  };

  window.addEventListener('resize',()=>fitButtons38(document.querySelector('.phone-screen')));
  installAppearance38();apply38();enhanceQueue38();fitButtons38(document.querySelector('.phone-screen'));
})();
</script>

<script id="ag-v2639-logout-queue-source-fix-js">
(function(){
  function queueItems39(){
    if(Array.isArray(state.v2635QueueItems)) return state.v2635QueueItems;
    // Fallback only if the v26.35 queue state has not yet been initialized.
    state.v2635QueueItems=[
      {id:'q1',title:'Nhật ký CH-07',kind:'Nhật ký',status:'Chờ gửi',time:'05/10/2026 15:40'},
      {id:'q2',title:'Ảnh bằng chứng · CH-07',kind:'Ảnh',status:'Đang gửi',time:'05/10/2026 15:41'},
      {id:'q3',title:'Lần cân TH-0310-07',kind:'Cân',status:'Đã gửi',time:'05/10/2026 15:35'},
      {id:'q4',title:'Biên bản kiểm tra CH-03',kind:'Biểu mẫu',status:'Đã gửi',time:'05/10/2026 14:58'}
    ];
    return state.v2635QueueItems;
  }
  function queueSummary39(){
    const c={pending:0,sending:0,error:0,sent:0,blocking:0};
    queueItems39().forEach(item=>{
      if(item.status==='Chờ gửi'){c.pending++;c.blocking++;}
      else if(item.status==='Đang gửi'){c.sending++;c.blocking++;}
      else if(item.status==='Lỗi'){c.error++;c.blocking++;}
      else c.sent++;
    });
    return c;
  }
  window.agQueueSummary39=queueSummary39;
  window.agHasUnsyncedQueue=function(){return queueSummary39().blocking>0};

  // Keep old demo queue mirrors aligned so no historical guard can disagree with the current UI.
  const sendAllBase39=window.agQueueSendAll;
  window.agQueueSendAll=function(){
    if(sendAllBase39) sendAllBase39.apply(this,arguments);
    if(state.v2617Queue){state.v2617Queue.retry='sent';state.v2617Queue.lastNotice='Tất cả dữ liệu đã được gửi thành công.'}
    state.offline=false;
    render();
  };

  function performLogout39(){
    if(typeof __cancelSplashSequence==='function') __cancelSplashSequence();
    state.logoutSheetOpen=false;
    state.prototypeAuthenticated=false;
    state.checkedIn=false;
    state.activeTask=false;
    navigationStack=[];
    __pendingMotion='auth';
    state.screen=state.tenantConfigured?'login':'tenantSetup';
    if(typeof syncBrowserHistory==='function') syncBrowserHistory('replace');
    render();
  }

  window.confirmLogout=function(){
    if(window.agHasUnsyncedQueue()){
      state.logoutSheetOpen=false;
      if(state.screen!=='logoutConfirm') go('logoutConfirm');
      else render();
      return;
    }
    performLogout39();
  };
  confirmLogout=window.confirmLogout;

  window.openLogoutSheet=function(){
    state.logoutSheetOpen=false;
    if(state.screen!=='logoutConfirm') go('logoutConfirm');
    else render();
  };

  // Rebind final logout-confirm renderer to the same queue source used by the actual guard.
  screens.logoutConfirm=function(){
    const c=queueSummary39();
    if(c.blocking>0){
      return appShell(`<div class="v2615-alert danger"><strong>Chưa thể đăng xuất</strong><span>Thiết bị còn ${c.pending} mục Chờ gửi, ${c.sending} mục Đang gửi và ${c.error} mục Lỗi. Hãy hoàn tất đồng bộ trước khi kết thúc phiên.</span></div><div class="v2615-grid" style="margin-top:12px"><div class="v2615-stat"><b>${c.pending}</b><span>Chờ gửi</span></div><div class="v2615-stat"><b>${c.sending}</b><span>Đang gửi</span></div><div class="v2615-stat"><b>${c.error}</b><span>Lỗi</span></div><div class="v2615-stat"><b>${c.sent}</b><span>Đã gửi</span></div></div><button class="btn primary block" style="margin-top:12px" onclick="goRoot('sync')">Mở Hàng chờ</button><button class="btn secondary block" style="margin-top:8px" onclick="goBack()">Tiếp tục làm việc</button>`,{title:'Đăng xuất'});
    }
    return appShell(`<div class="banner ok"><strong>Đồng bộ hoàn tất</strong>Không còn mục Chờ gửi, Đang gửi hoặc Lỗi trên thiết bị.</div><div class="card" style="margin-top:12px"><div class="card-title">Đăng xuất khỏi AgriOS?</div><div class="card-sub">Bạn sẽ quay về màn đăng nhập của doanh nghiệp hiện tại.</div></div><button class="btn danger block" style="margin-top:12px" onclick="confirmLogout()">Đăng xuất</button><button class="btn secondary block" style="margin-top:8px" onclick="goBack()">Hủy</button>`,{title:'Đăng xuất'});
  };
})();
</script>

<script id="ag-v2642-compact-loader-js">
(function(){
  /* One concise loader for app and in-app transitions.
     The old three bars were skeleton placeholders; v26.56 removes them. */
  window.__leafLoaderMarkup=function(){
    return `<div class="leaf-loading-overlay" role="status" aria-live="polite">
      <div class="leaf-loading-box">
        <div class="leaf-loading-core">
          <svg class="leaf-progress-logo" viewBox="0 0 64 64" aria-hidden="true">
            <defs><clipPath id="agLeafLoadClip42"><path d="M54 7C35 7 18 15 10 31C5 41 9 52 20 56C35 61 51 46 54 7Z"/></clipPath></defs>
            <path class="leaf-base" d="M54 7C35 7 18 15 10 31C5 41 9 52 20 56C35 61 51 46 54 7Z"/>
            <g clip-path="url(#agLeafLoadClip42)"><rect class="leaf-fill" x="0" y="58" width="64" height="0"/></g>
            <path class="leaf-vein" d="M17 50C28 39 38 29 50 14"/>
          </svg>
          <div class="leaf-loading-label">Đang tải</div>
          <div class="leaf-loading-percent">0%</div>
        </div>
      </div>
    </div>`;
  };
  try{ __leafLoaderMarkup = window.__leafLoaderMarkup; }catch(e){}

  /* Rebind login loader so the concise label is guaranteed here as well. */
  window.enterAppWithLoading=function(){
    state.prototypeAuthenticated=true;
    const host=document.getElementById('app')||document.querySelector('.phone-screen');
    if(!host)return;
    host.querySelector('.leaf-loading-overlay')?.remove();
    host.insertAdjacentHTML('beforeend',window.__leafLoaderMarkup());
    const overlay=host.querySelector('.leaf-loading-overlay');
    const fill=overlay?.querySelector('.leaf-fill');
    const pct=overlay?.querySelector('.leaf-loading-percent');
    const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const duration=reduce?380:950,start=performance.now();
    const step=now=>{
      const raw=Math.max(0,Math.min(1,(now-start)/duration));
      const eased=1-Math.pow(1-raw,2.2);
      const p=Math.round(eased*100);
      if(fill){
        const h=51*eased;
        fill.setAttribute('y',String(58-h));
        fill.setAttribute('height',String(h));
      }
      if(pct)pct.textContent=p+'%';
      if(raw<1)return requestAnimationFrame(step);
      setTimeout(()=>{
        navigationStack=[];
        state.screen=defaultScreenForRole[state.role]||'today';
        syncBrowserHistory('replace');
        render();
      },reduce?30:90);
    };
    requestAnimationFrame(step);
  };
})();
</script>
