<!doctype html><html lang="vi" data-vbda-role="qc"><head><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VBDAgri · QC · Thủy sản</title><style>/* Original AgriOS standalone base component selectors (reused directly). */
:root {
  --bg-page: #F4F8F5;
  --bg-surface: #FFFFFF;
  --bg-nav: #FFFFFF;
  --bg-map: #E8F1EB;
  --text: #14231B;
  --text-secondary: #3C4A41;
  --text-muted: #5F6D63;
  --text-on-primary: #FFFFFF;
  --nav-active-bg: #E3F5EC;
  --nav-active-text: #0B5A3B;
  --border: #C5D0C7;
  --border-strong: #96A69B;
  --divider: #E6EBE4;
  --primary: #0F7A52;
  --primary-hover: #0B6B45;
  --primary-tint: #E3F5EC;
  --green-500: #22A06B;
  --ok-bg: #DDF0E3;
  --ok-fg: #1D5B37;
  --info-bg: #DDEAF5;
  --info-fg: #164B78;
  --warn-bg: #FBE8D5;
  --warn-fg: #8A4308;
  --danger-bg: #F9DEDB;
  --danger-fg: #8C1D16;
  --neutral-bg: #E6EAE6;
  --neutral-fg: #4B574F;
  --phase-bg: #F8EBD3;
  --phase-fg: #7A4F0C;
  --card-shadow: 0 10px 24px rgba(7, 38, 25, 0.08), 0 2px 6px rgba(7, 38, 25, 0.05);
  --card-shadow-soft: 0 8px 18px rgba(7, 38, 25, 0.06), 0 2px 5px rgba(7, 38, 25, 0.04);
  --lot-harvesting: #4CB483;
  --lot-care: #A9DCC0;
  --lot-isolation: #F1C46A;
  --lot-rest: #D5DCD7;
  --focus-ring: 0 0 0 3px rgba(15, 122, 82, .18);
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  font-family: "Be Vietnam Pro", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg-page);
  color: var(--text);
  font-size: 15px;
}
.btn { min-height: 40px; border-radius: 8px; border: 1px solid transparent; padding: 0 14px; font-weight: 600; }
.phone-frame { width: 406px; height: 860px; background: #101513; border: 8px solid #101513; border-radius: 36px; padding: 0; position: relative; overflow: hidden; }
.phone-sensor { position: absolute; z-index: 20; top: 8px; left: 50%; transform: translateX(-50%); width: 110px; height: 20px; border-radius: 0 0 14px 14px; background: #101513; }
.phone-screen { width: 390px; height: 844px; background: var(--bg-page); overflow: hidden; position: relative; }
.mobile-root { height: 100%; display: flex; flex-direction: column; background: var(--bg-page); }
.mobile-header { background: var(--primary); color: #fff; padding: 28px 16px 13px; flex: 0 0 auto; }
.mobile-content {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 14px 14px 86px;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: 76px; background: #fff; border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(5, 1fr); padding: 7px 4px 8px; }
.card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 13px; box-shadow: var(--card-shadow-soft); }
.icon-tile { width: 38px; height: 38px; flex: 0 0 auto; border-radius: 9px; background: var(--primary-tint); color: var(--primary); display: grid; place-items: center; font-size: 18px; }
.list-item { padding: 11px 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--divider); min-height: 58px; }
.field { display: grid; gap: 5px; }
.login-screen { height: 100%; background: #fff; padding: 48px 22px 24px; display: flex; flex-direction: column; }
.splash-screen { height: 100%; background: var(--primary); color: #fff; display: flex; flex-direction: column; padding: calc(var(--safe-top) + 24px) 24px calc(var(--safe-bottom) + 24px); position: relative; overflow: hidden; }
.prototype-page { min-height:100vh; margin:0; background:#EDF3EF; color:var(--text); }
.prototype-stage { display:grid; place-items:center; padding:26px; overflow:auto; }

/* VBDAgri aquaculture design tokens (DESIGN-01 + PO selected state). */
:root{--primary:#FDE047;--primary-hover:#FACC15;--primary-tint:#FEF7D8;--bg-page:#F8F9FA;--bg-surface:#FFFFFF;--bg-nav:#FFF;--text:#111827;--text-secondary:#4B5563;--text-muted:#667085;--border:#E5E7EB;--border-strong:#CBD5E1;--divider:#E5E7EB;--selected-bg:#FEF7D8;--selected-fg:#57440B;--nav-active-bg:#FEF7D8;--nav-active-text:#57440B;--text-on-primary:#111827;--card-shadow-soft:0 4px 12px rgba(20,30,40,.06)}
html,body{height:100%;} body{background:#EEF4F1;} .prototype-stage{min-height:100vh;padding:20px;display:grid;place-items:center}
.phone-frame{margin:auto;width:406px;height:860px;max-width:100%;border:7px solid #101513;border-radius:54px;overflow:hidden;position:relative;background:#101513;box-shadow:0 14px 30px #10202029;padding:0}
.phone-sensor{position:absolute;top:0;left:50%;transform:translateX(-50%);border-radius:0 0 16px 16px;background:#101513;width:124px;height:32px;z-index:100}
.phone-sensor:after{content:'';width:56px;height:6px;border-radius:8px;background:#29332F;position:absolute;left:34px;top:9px}
.phone-screen{width:100%;height:100%;background:var(--bg-page);position:relative;overflow:hidden}
.mobile-root{height:100%;min-height:0;display:flex;flex-direction:column;background:var(--bg-page)}
.mobile-header{background:var(--primary);color:var(--text);padding:32px 16px 13px;flex-shrink:0}
.mobile-header .brand-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mobile-header .title-row{display:flex;align-items:center;justify-content:space-between;margin-top:13px}
.mobile-header h2{font-size:21px;line-height:1.3;color:var(--text);margin:0}
.mobile-header .tenant,.mobile-header .role-chip{color:#111827!important}
.mobile-content{flex:1;min-height:0;overflow:auto;padding:14px 14px 20px;background:var(--bg-page);scrollbar-width:thin}
.bottom-nav{position:relative;flex:0 0 81px;height:81px;min-height:81px;z-index:10;width:100%;border-top:1px solid var(--border);background:white;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:8px 4px 15px;box-shadow:0 -3px 10px rgba(20,35,27,.05)}
.bottom-nav button{width:100%;min-width:0;padding:3px 1px 1px;border:0;border-radius:10px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#647168;font-size:9px;white-space:nowrap}
.bottom-nav button svg{height:21px;width:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bottom-nav button.active{background:var(--selected-bg);color:#55400E}
.bottom-nav button.active::before{display:none}
.bottom-nav .ai-nav-fab{grid-column:3;position:relative;top:-17px;margin:0 auto;width:56px;height:56px;min-width:56px;min-height:56px;flex:none;border-radius:50%;background:#D6B23F;border:4px solid #FFF;box-shadow:0 7px 17px #4333102B;display:flex;align-items:center;justify-content:center;color:#FFF;}
.bottom-nav .ai-nav-fab svg{width:27px;height:27px;display:block;stroke:white;fill:none}
.bottom-nav .nav-spacer{grid-column:3}
.phone-home-indicator{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);height:4px;width:110px;background:#25322C;border-radius:99px;z-index:25;pointer-events:none}
.aq-brand{display:flex;align-items:center;gap:8px;font-size:13px;line-height:1.2;font-weight:800}.aq-brand img{width:36px;height:36px;object-fit:contain;border-radius:9px;background:white;padding:3px}.aq-brand small{display:block;font-size:10px;font-weight:600;color:#343231;margin-top:2px}
.aq-role-pill{min-width:38px;min-height:36px;display:grid;place-items:center;border-radius:12px;background:white;color:#5A4611;font-size:11px;font-weight:800}
.aq-sync{font-size:9px;padding:5px 8px;color:#504112;background:#FFFFFF66;border:1px solid #FFFFFF8A;border-radius:14px}
.aq-priority{border:1px solid #E7D49E;background:#FFF7DF;border-radius:14px;padding:14px;margin-bottom:18px}
.aq-eyebrow{font-size:10px;letter-spacing:.075em;color:#7A5A11;font-weight:800;text-transform:uppercase}
.aq-priority .aq-priority-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px}.aq-priority strong{font-size:15px}.aq-priority p{margin:4px 0 0;font-size:11px;color:#616468}
.aq-priority button,.aq-submit{border:0;border-radius:9px;background:#FDE047;color:#111827;font-size:11px;padding:11px 12px;font-weight:800}
.aq-subhead{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}.aq-subhead h3{font-size:16px;color:#111827;margin:0}.aq-subhead button{border:0;background:transparent;color:#7B5E0A;font-size:11px;font-weight:700}
.aq-quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.aq-quick button{border:1px solid #E8E4DA;border-radius:12px;background:#FFF;min-width:0;min-height:82px;padding:9px 1px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;box-shadow:var(--card-shadow-soft)}
.aq-quick span{width:37px;height:37px;border-radius:11px;display:grid;place-items:center;background:#FEF7D8;color:#846713}.aq-quick svg,.aq-row-icon svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}.aq-quick small{font-size:10px;font-weight:700;color:#111827}
.aq-stack{display:flex;flex-direction:column;gap:9px}.aq-row{border:1px solid #E9E2D5;border-radius:12px;background:#FFF;display:flex;align-items:center;gap:9px;text-align:left;padding:11px;width:100%;min-height:64px;color:#111827;box-shadow:var(--card-shadow-soft)}
.aq-row-icon{display:grid;place-items:center;flex-shrink:0;width:35px;height:35px;border-radius:9px;background:#FEF7D8;color:#826714}.aq-row-main{flex:1;min-width:0}.aq-row-main strong{font-size:12px;display:block}.aq-row-main small{font-size:10px;color:#667085;display:block;margin-top:4px;line-height:1.35}.aq-chevron{color:#89918B;font-size:19px}
.aq-badge{display:inline-block;padding:5px 7px;border-radius:10px;background:#E9EEEA;color:#495A50;font-weight:600;font-size:10px}
.aq-panel{padding:14px;background:white;border:1px solid #E7E1D6;border-radius:12px;box-shadow:var(--card-shadow-soft);margin:10px 0}
.aq-panel h3{font-size:14px;margin:0 0 9px}.aq-panel p{font-size:12px;line-height:1.6;color:#5E6670}
.aq-field{display:flex;flex-direction:column;gap:6px;margin:13px 0;font-size:12px;font-weight:600;color:#374151}.aq-field input,.aq-field select,.aq-field textarea{border:1px solid #CAD3CF;border-radius:9px;padding:10px;width:100%;min-height:42px;font:inherit;background:#FFF;color:#111827}
.aq-submit{width:100%;font-size:13px;min-height:43px;margin-top:10px}.aq-error{border:1px solid #E8B4A6;background:#FFF1EC;color:#8A2C1C;border-radius:9px;padding:10px;font-size:12px;margin:7px 0}.aq-success{border:1px solid #B1DCC2;background:#EFFAF1;color:#236744;border-radius:9px;padding:10px;font-size:12px;margin:7px 0}
.aq-back{width:32px;height:32px;border:0;border-radius:9px;background:#FFFFFFB9;color:#111827;font-size:21px;font-weight:700;line-height:1}
.aq-auth{height:100%;width:100%;background:linear-gradient(180deg,rgba(9,44,33,.21),rgba(2,35,28,.49)),var(--aq-photo) center/cover no-repeat;display:flex;align-items:center;justify-content:center;padding:22px;overflow:hidden}
.aq-login-center{width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;gap:16px}.aq-login-logo{width:62px;height:62px;object-fit:contain;background:white;border-radius:18px;padding:5px}.aq-login-brand{text-align:center;color:#FFF}.aq-login-brand strong{font-size:28px;display:block}.aq-login-brand small{font-size:12px;display:block;margin-top:3px}
.aq-login-panel{width:100%;padding:18px;border-radius:20px;background:#FFFFFFF5;box-shadow:0 12px 26px #10271837}.aq-login-panel h2{text-align:center;font-size:20px;margin:2px 0 14px}.aq-tenant{background:#FDE047;border-radius:12px;padding:10px;display:flex;align-items:center;gap:9px;color:#111827}.aq-tenant .aq-role-pill{min-height:33px}.aq-tenant strong{display:block;font-size:12px}.aq-tenant small{font-size:10px}.aq-login-panel .aq-submit{margin-top:9px}
.aq-auth-loader{width:200px;height:6px;background:#FFFFFF65;border-radius:99px;overflow:hidden}.aq-auth-loader span{display:block;height:100%;width:62%;background:#FDE047}
.aq-empty{border:1px dashed #D9DBDB;border-radius:12px;padding:22px;text-align:center;background:white;color:#667085;font-size:12px}
.aq-info{font-size:11px;line-height:1.55;color:#667085;margin:9px 0}
@media (max-width:480px){.prototype-stage{padding:0;min-height:100dvh}.phone-frame{width:100vw;height:100dvh;border:0;border-radius:0}.phone-screen{height:100%}.phone-home-indicator{bottom:5px}}

/* Mobile design alignment: VBDAgri Crop v26.57/current UI, Aqua theme preserved. */
:root{--primary:#FDE047;--primary-hover:#FACC15;--primary-tint:#FEF7D8;--selected-bg:#FEF7D8;--selected-fg:#57440B;--nav-active-bg:#FEF7D8;--nav-active-text:#57440B;--bg-page:#F6F8F7;--bg-surface:#fff;--text:#15221C;--text-secondary:#405047;--text-muted:#66746A;--border:#DDE5DF;--divider:#E8EDE9;--card-shadow-soft:0 4px 14px rgba(17,40,28,.055);--focus-ring:0 0 0 3px rgba(186,145,13,.24);--safe-top:env(safe-area-inset-top, 0px);--safe-bottom:env(safe-area-inset-bottom, 0px);--shell-radius:14px;--space:14px}
html,body{margin:0;min-height:100%;font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--text);font-size:15px}button,input,select,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #8D751E;outline-offset:2px;box-shadow:var(--focus-ring)}
.prototype-stage{padding:clamp(0px,2vw,22px);min-height:100dvh;box-sizing:border-box;background:#EDF2EE}.phone-frame{width:406px;height:min(860px,calc(100dvh - 24px));min-height:600px;max-width:100%;border-radius:43px}.phone-screen{width:100%;height:100%;overflow:hidden}.mobile-root{height:100%;min-height:0;display:flex;flex-direction:column;background:var(--bg-page)}.mobile-content{flex:1 1 0;min-height:0;overflow:auto;overscroll-behavior:contain;padding:16px 14px 22px;scrollbar-width:none}.mobile-content::-webkit-scrollbar,.ai-chat-messages::-webkit-scrollbar{display:none}
.mobile-header{background:#fff;color:var(--text);position:relative;padding:calc(15px + var(--safe-top)) 15px 12px;flex:0 0 auto;border-bottom:1px solid var(--border);box-shadow:0 3px 13px rgba(13,36,20,.025)}.mobile-header:before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--primary)}.mobile-header .brand-row{min-height:34px;gap:12px}.mobile-header .title-row{margin-top:12px;display:flex;gap:10px;align-items:center;min-height:32px}.mobile-header .title-row h2{font-size:20px;line-height:1.24;letter-spacing:-.35px;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}.aq-brand{gap:9px;font-size:13px}.aq-brand img{width:36px;height:36px;background:#fff;border:1px solid var(--border);border-radius:11px;padding:3px}.aq-brand small{font-size:11px;font-weight:600;color:var(--text-muted);margin-top:3px}.aq-role-pill{background:#FEF7D8;color:#645019;border:1px solid #E7D9AB;min-height:34px;border-radius:10px}.aq-back{min-width:44px;min-height:44px;border-radius:11px;background:#F3F6F3;font-size:24px}.aq-sync{font-size:10px;white-space:nowrap;background:#F3F6F3;border-color:#E4EAE4;color:#526157;max-width:89px;overflow:hidden;text-overflow:ellipsis}
.bottom-nav{position:relative;flex:0 0 auto;height:calc(74px + var(--safe-bottom));min-height:74px;width:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;padding:8px 8px calc(9px + var(--safe-bottom));background:#fff;border-top:1px solid var(--border);box-shadow:0 -5px 18px rgba(20,37,27,.07);overflow:visible;z-index:20}.bottom-nav>button:not(.ai-nav-fab){padding:6px 0 2px;border:0;border-radius:10px;background:transparent;min-height:53px;min-width:0;width:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;font-size:10px;line-height:1.25;font-weight:600;color:#617066;position:relative;z-index:1}.bottom-nav>button:not(.ai-nav-fab) span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.bottom-nav>button:not(.ai-nav-fab).active{background:var(--selected-bg);color:#654E0B;font-weight:800}.bottom-nav>button:not(.ai-nav-fab).active:before{display:none}.bottom-nav>button:nth-of-type(1){grid-column:1}.bottom-nav>button:nth-of-type(2){grid-column:2}.bottom-nav>button:nth-of-type(3){grid-column:3}.bottom-nav>button:nth-of-type(4){grid-column:4}.bottom-nav>button:nth-of-type(5){grid-column:5}.bottom-nav>button:not(.ai-nav-fab) svg{width:21px;height:21px;flex:0 0 21px}.bottom-nav .ai-nav-fab{grid-column:3;top:-21px;margin:0 auto;width:56px;min-width:56px;height:56px;min-height:56px;border:4px solid #fff;border-radius:50%;background:#FDE047;box-shadow:0 6px 17px rgba(89,71,10,.20);color:#342A0F;z-index:2;transition:transform .19s ease,background .19s ease}.bottom-nav .ai-nav-fab.active{background:#FACC15}.bottom-nav .ai-nav-fab:active{transform:translateY(2px) scale(.96)}.bottom-nav .ai-nav-fab svg{width:27px;height:27px;stroke:currentColor;fill:none}.bottom-nav .nav-active-slider{position:absolute;top:0;height:3px;border-radius:999px;width:calc((100% - 16px)/5 - 18px);left:calc(8px + ((100% - 16px)/5)*var(--active-col,0) + 9px);background:#B18C13;pointer-events:none;z-index:1}.phone-home-indicator{z-index:40;pointer-events:none}
.aq-quick{gap:9px}.aq-quick button,.aq-row,.aq-panel,.aq-priority{border-radius:var(--shell-radius);border:1px solid var(--border);box-shadow:var(--card-shadow-soft);background:#fff}.aq-quick button{min-height:88px;padding:10px 4px;gap:7px}.aq-quick button small{font-size:11px;line-height:1.25;font-weight:700}.aq-quick span,.aq-row-icon{background:#FEF7D8;color:#826811;border-radius:11px}.aq-row{min-height:69px;padding:12px;gap:11px}.aq-row-main strong{font-size:13px;line-height:1.35}.aq-row-main small{font-size:11px;line-height:1.45;color:var(--text-muted)}.aq-badge{background:#EEF3EF;color:#4E6254}.aq-panel{padding:15px;margin:12px 0}.aq-panel h3{font-size:16px}.aq-panel p{font-size:12px}.aq-priority{background:#FFF9E7;border-color:#E7DBB0;margin:16px 0}.aq-subhead{margin:20px 0 11px}.aq-subhead h3{font-size:17px;font-weight:800}.aq-subhead button{min-height:42px}.aq-field{font-size:13px;gap:7px}.aq-field input,.aq-field select,.aq-field textarea{min-height:46px;border-radius:11px;border-color:#CAD6CD;background:#fff;font-size:14px;max-width:100%}.aq-submit,.aq-priority button{border-radius:11px;background:#FDE047;color:#15201B;min-height:44px;font-size:13px}.aq-submit:active,.aq-quick button:active,.aq-row:active{transform:scale(.992);filter:brightness(.985)}.aq-submit:disabled{opacity:.52;pointer-events:none}.aq-success,.aq-error{border-radius:11px}
/* Splash and login follow Crop app-shell choreography; Aqua retains its own brand photo and logo. */
.aq-auth{height:100%;min-height:0;width:100%;position:relative;padding:calc(22px + var(--safe-top)) 22px calc(22px + var(--safe-bottom));background:linear-gradient(180deg,rgba(3,25,17,.25),rgba(3,28,19,.64)),var(--aq-photo) center/cover no-repeat;overflow:auto;display:flex;align-items:center;justify-content:center}.aq-login-center{width:100%;max-width:320px;gap:16px}.aq-login-logo{width:76px;height:76px;padding:7px;border-radius:23px;background:#fff;box-shadow:0 12px 25px rgba(5,25,13,.15)}.aq-login-brand strong{font-size:26px;font-weight:800;color:#fff;letter-spacing:-.45px}.aq-login-brand small{font-size:12px;color:#fff;opacity:.95;margin-top:4px}.aq-login-panel{border:1px solid rgba(255,255,255,.65);border-radius:22px;padding:21px;background:rgba(255,255,255,.96);box-shadow:0 15px 32px rgba(0,0,0,.15)}.aq-login-panel h2{font-size:21px}.aq-tenant{background:#FEF7D8;color:#4B3C14;border:1px solid #EFDA91}.aq-login-panel .aq-submit{font-size:14px}.aq-login-panel .aq-field{font-size:12px}.aq-login-panel input{width:100%;box-sizing:border-box}
.aq-splash{animation:aqFadeIn .34s ease-out both}.aq-splash .aq-login-center{gap:19px;transform:translateY(-7px)}.aq-splash .aq-login-logo{width:86px;height:86px;border-radius:26px;animation:aqSplashMark 1.1s cubic-bezier(.2,.72,.23,1) both}.aq-splash .aq-login-brand{text-align:center}.aq-splash .aq-login-brand strong{font-size:29px}.aq-splash .aq-splash-progress{width:min(236px,90%);height:6px;border-radius:100px;background:rgba(255,255,255,.44);overflow:hidden;margin-top:9px}.aq-splash .aq-splash-progress span{height:100%;width:0;display:block;background:#FDE047;border-radius:100px;transition:width .075s linear}.aq-splash .aq-splash-label{font-size:12px;font-weight:600;letter-spacing:.02em;color:#fff}.aq-splash .aq-splash-orb{position:absolute;inset:auto -110px -160px auto;width:340px;height:340px;border-radius:50%;border:1px solid rgba(255,255,255,.25);pointer-events:none;animation:aqOrb 5s ease-in-out infinite}.aq-auth:not(.aq-splash) .aq-login-center{animation:aqEnter .3s ease-out both}
/* Crop chat architecture: full-screen dialog, message stream, contextual actions and fixed composer. */
.ai-chat-screen{background:var(--bg-page);height:100%;display:flex;flex-direction:column;min-height:0}.ai-chat-header{background:#fff;border-bottom:1px solid var(--border);padding:calc(20px + var(--safe-top)) 14px 13px;display:flex;align-items:center;gap:11px;flex:0 0 auto;min-height:87px;box-sizing:border-box;position:relative}.ai-chat-header:before{content:'';position:absolute;left:0;right:0;top:0;background:var(--primary);height:4px}.ai-chat-header button{min-width:44px;min-height:44px;display:grid;place-items:center;border:0;background:#F2F5F2;border-radius:12px;color:var(--text);font-size:21px}.ai-chat-header strong{font-size:16px;display:block}.ai-chat-header small{font-size:11px;display:block;margin-top:4px;color:var(--text-muted)}.ai-chat-header .ai-new{margin-left:auto;font-size:12px;display:flex;gap:4px;min-width:44px;padding:0 12px;color:#6D560A;background:#FEF7D8}.ai-chat-messages{overflow-y:auto;overscroll-behavior:contain;min-height:0;flex:1 1 0;padding:16px 14px;scrollbar-width:none}.ai-chat-thread{display:flex;flex-direction:column;gap:11px}.ai-chat-row{display:flex;width:100%}.ai-chat-row.user{justify-content:flex-end}.ai-chat-row.assistant,.ai-chat-row.typing{justify-content:flex-start}.ai-chat-bubble{max-width:88%;border-radius:16px;line-height:1.55;font-size:13px;padding:12px 14px;box-shadow:var(--card-shadow-soft);overflow-wrap:anywhere;white-space:pre-wrap}.ai-chat-row.user .ai-chat-bubble{background:var(--primary);color:var(--text)}.ai-chat-row.assistant .ai-chat-bubble,.ai-chat-row.typing .ai-chat-bubble{background:#fff;border:1px solid var(--border);color:var(--text)}.ai-typing-dots{display:flex;gap:5px;padding:3px 0}.ai-typing-dots span{width:6px;height:6px;border-radius:50%;background:#998230;animation:aqTyping 1.1s ease-in-out infinite}.ai-typing-dots span:nth-child(2){animation-delay:.15s}.ai-typing-dots span:nth-child(3){animation-delay:.3s}.ai-action-bar{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0 2px}.ai-action-bar button{border: function aiMatch(q){const n=q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');const items=ACTIONS.filter(x=>canAccess(x[0])).map(x=>({a:x[0],n:x[1].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d')}));const found=items.find(x=>n.includes(x.n)&&x.n.length>3)||items.find(x=>x.n.split(' ').filter(y=>y.length>3).some(y=>n.includes(y)));return found?.a||null}

function saveAction(id,form){const v=Object.fromEntries(new FormData(form));
 const onlineOnly=['harvestNew','lotNew','harvestClose','harvestCancel','dispatch','treatmentNew','treatmentEdit','treatmentClose','treatmentCancel','transfer','alertDetail','planDetail','receive','gate','approvalDetail','returnDetail'].includes(id);
 if(state.offline&&onlineOnly)return failed('Thao tác này cần kết nối mạng; không được đưa vào hàng chờ.');
 for(const [k,val] of Object.entries(v))if(val===''&&!['note','reason','measure'].includes(k)){state.feedback={type:'error',text:`Vui lòng nhập ${k}.`};render();return}
 if((id==='visit'||id==='taskDetail')&&v.status==='Bỏ qua'&&!v.reason.trim())return failed('Bỏ qua phải có lý do.');
 if((id==='receive'||id==='returnDetail')&&Number(v.actual)!==Number(v.requested)&&!String(v.reason||'').trim())return failed('Chênh lệch thực nhận phải có lý do.');
 if(id==='harvestNew'){
  const uses=data.diaries.filter(x=>x.pond===v.pond&&x.payload&&x.payload.ticket&&x.status!=='Đã hủy');
  const now=Date.now();
  for(const use of uses){
   const days=Number(use.payload.withdrawalDays||use.payload.withdrawal||0);
   const usedAt=Date.parse(use.usedAt||use.createdAt||'');
   if(days>0&&Number.isFinite(usedAt)&&now<usedAt+days*86400000)return failed('Ao còn trong thời gian ngưng thuốc; chưa được tạo đợt thu.');
  }
 }
 if(id==='weigh'&&(Number(v.tare)>=Number(v.gross)||Number(v.gross)<=0))return failed('Khối lượng tịnh phải lớn hơn 0 và tổng phải lớn hơn bì.');
 if(id==='inspection'){
  data.qcLots ||= [{id:'LTH-2026-0058',received:true,status:'Chờ QC',labPending:false},{id:'LTH-2026-0059',received:false,status:'Chờ cân nhận',labPending:true}];
  const lot=data.qcLots.find(x=>x.id===String(v.lot||'').trim().split(/\s+/)[0]);
  if(!lot||!lot.received)return failed('Chỉ kiểm QC sau sự kiện cân nhận nhà máy.');
